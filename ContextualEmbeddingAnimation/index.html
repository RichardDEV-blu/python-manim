<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contextual Representations</title>

    <style>

        @import url(
            'https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap'
        );

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Montserrat', sans-serif;
        }

        #scene {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
        }

        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: #F5F5F7;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        #title {
            position: absolute;

            top: 52px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 92%;

            text-align: center;

            font-size: 46px;

            font-weight: 800;

            letter-spacing: 2.5px;

            line-height: 1.05;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 1.2s ease;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        #subtitle {
            position: absolute;

            top: 116px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 90%;

            text-align: center;

            font-size: 30px;

            font-weight: 500;

            letter-spacing: 1.7px;

            line-height: 1.35;

            color: #AAB0BF;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 1.2s ease;
        }


        /* =====================================================
           EQUATION
        ===================================================== */

        #equation {
            position: absolute;

            bottom: 145px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 92%;

            text-align: center;

            font-size: 34px;

            font-weight: 700;

            letter-spacing: 1.2px;

            line-height: 1.15;

            white-space: nowrap;

            opacity: 0;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }


        /* =====================================================
           CAPTION
        ===================================================== */

        #caption {
            position: absolute;

            bottom: 78px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 88%;

            text-align: center;

            font-size: 42px;

            line-height: 1.4;

            font-weight: 500;

            letter-spacing: 0.45px;

            color: #AAB0BF;

            opacity: 0;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

    </style>
</head>


<body>

<div id="scene"></div>


<div id="ui">

    <div id="title">
        CONTEXTUAL REPRESENTATIONS
    </div>

    <div id="subtitle">
        WORD MEANING CAN CHANGE WITH CONTEXT
    </div>

    <div id="equation"></div>

    <div id="caption"></div>

</div>


<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setClearColor(
    0x000000,
    1
);


document
    .getElementById("scene")
    .appendChild(
        renderer.domElement
    );


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        52,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );


/*
 * Single radius declaration.
 *
 * Smaller radius = larger 3D composition.
 */

const radius = 14.2;


camera.position.set(
    0,
    0,
    radius
);


/* =========================================================
   WORLD
========================================================= */

const world =
    new THREE.Group();

scene.add(world);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.55
    )
);


const pointLight =
    new THREE.PointLight(
        0xffffff,
        1.2,
        40
    );


pointLight.position.set(
    5,
    8,
    10
);


scene.add(pointLight);


/* =========================================================
   GRID
========================================================= */

const grid =
    new THREE.GridHelper(
        18,
        18,
        0x555B70,
        0x2B2F3A
    );


grid.material.transparent =
    true;


grid.material.opacity =
    0.18;


world.add(grid);


/* =========================================================
   AXES
========================================================= */

function createAxis(
    direction,
    color
) {

    const points = [

        new THREE.Vector3(
            0,
            0,
            0
        ),

        direction
    ];


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const material =
        new THREE.LineBasicMaterial({

            color,

            transparent:
                true,

            opacity:
                0.22
        });


    return new THREE.Line(
        geometry,
        material
    );
}


world.add(
    createAxis(
        new THREE.Vector3(
            7,
            0,
            0
        ),
        0x555B70
    )
);


world.add(
    createAxis(
        new THREE.Vector3(
            0,
            7,
            0
        ),
        0x555B70
    )
);


world.add(
    createAxis(
        new THREE.Vector3(
            0,
            0,
            7
        ),
        0x555B70
    )
);


/* =========================================================
   PARTICLE FIELD
========================================================= */

const particleCount =
    150;


const particleGeometry =
    new THREE.BufferGeometry();


const particlePositions =
    new Float32Array(
        particleCount * 3
    );


for (
    let i = 0;
    i < particleCount;
    i++
) {

    particlePositions[
        i * 3
    ] =
        (
            Math.random() - 0.5
        ) * 18;


    particlePositions[
        i * 3 + 1
    ] =
        (
            Math.random() - 0.5
        ) * 12;


    particlePositions[
        i * 3 + 2
    ] =
        (
            Math.random() - 0.5
        ) * 12;
}


particleGeometry.setAttribute(
    "position",

    new THREE.BufferAttribute(
        particlePositions,
        3
    )
);


const particleMaterial =
    new THREE.PointsMaterial({

        color: 0x555B70,

        size: 0.035,

        transparent: true,

        opacity: 0
    });


const particles =
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );


world.add(particles);


/* =========================================================
   VECTOR DIRECTIONS
========================================================= */

const dirA =
    new THREE.Vector3(
        3,
        2,
        1
    ).normalize();


const dirB =
    new THREE.Vector3(
        2.2,
        2.8,
        1.8
    ).normalize();


const dirC =
    new THREE.Vector3(
        -2,
        2.5,
        2
    ).normalize();


/* =========================================================
   VECTOR CREATION
========================================================= */

function createVector(
    direction,
    color
) {

    const arrow =
        new THREE.ArrowHelper(

            direction,

            new THREE.Vector3(
                0,
                0,
                0
            ),

            0,

            color,

            0.34,

            0.16
        );


    /*
     * Shaft and tip are independently
     * transparent.
     */

    arrow.line.material.transparent =
        true;

    arrow.cone.material.transparent =
        true;


    arrow.line.material.opacity =
        1;

    arrow.cone.material.opacity =
        1;


    return arrow;
}


const vectorA =
    createVector(
        dirA,
        0x6EA8FE
    );


const vectorB =
    createVector(
        dirB,
        0xC084FC
    );


const vectorC =
    createVector(
        dirC,
        0x4ADE80
    );


vectorA.visible = false;
vectorB.visible = false;
vectorC.visible = false;


world.add(vectorA);
world.add(vectorB);
world.add(vectorC);


/* =========================================================
   EMBEDDING LABELS
========================================================= */

function createTextSprite(
    text,
    color
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 768;
    canvas.height = 180;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Large enough for 1080 × 1920.
     */

    ctx.font =
        "800 72px Montserrat";


    ctx.fillStyle =
        color;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        text,

        canvas.width / 2,

        canvas.height / 2
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.minFilter =
        THREE.LinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    const material =
        new THREE.SpriteMaterial({

            map: texture,

            transparent: true,

            opacity: 0,

            depthTest: false,

            depthWrite: false
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.scale.set(
        1.85,
        0.45,
        1
    );


    return sprite;
}


const labelA =
    createTextSprite(
        "RUN₁",
        "#6EA8FE"
    );


const labelB =
    createTextSprite(
        "RUN₂",
        "#C084FC"
    );


const labelC =
    createTextSprite(
        "RUN₃",
        "#4ADE80"
    );


world.add(labelA);
world.add(labelB);
world.add(labelC);


/* =========================================================
   UPDATE VECTOR LABEL
========================================================= */

function updateVectorLabel(
    label,
    direction,
    length
) {

    label.position.copy(
        direction
    );


    label.position.multiplyScalar(
        length + 0.40
    );
}


/* =========================================================
   TOKENS
========================================================= */

const tokenPositions = [

    [
        -3.5,
        0.5,
        0
    ],

    [
        -1.8,
        1.5,
        0.3
    ],

    [
        0,
        0.8,
        0
    ],

    [
        1.8,
        1.7,
        -0.2
    ],

    [
        3.5,
        0.5,
        0
    ]
];


const tokenColors = [

    0x6EA8FE,

    0xC084FC,

    0x4ADE80,

    0xF5F5F7,

    0x6EA8FE
];


const tokens = [];


for (
    let i = 0;
    i < tokenPositions.length;
    i++
) {

    const geometry =
        new THREE.SphereGeometry(
            0.16,
            12,
            12
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                tokenColors[i],

            transparent: true,

            opacity: 0
        });


    const token =
        new THREE.Mesh(
            geometry,
            material
        );


    token.position.set(
        ...tokenPositions[i]
    );


    token.scale.setScalar(
        0
    );


    world.add(token);


    tokens.push(token);
}


/* =========================================================
   ATTENTION LINES
========================================================= */

const attentionLines = [];


for (
    let i = 0;
    i < tokens.length;
    i++
) {

    for (
        let j = i + 1;
        j < tokens.length;
        j++
    ) {

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints([

                    tokens[i].position,

                    tokens[j].position
                ]);


        const material =
            new THREE.LineBasicMaterial({

                color: 0x555B70,

                transparent: true,

                opacity: 0
            });


        const line =
            new THREE.Line(
                geometry,
                material
            );


        world.add(line);


        attentionLines.push(line);
    }
}


/* =========================================================
   ATTENTION PULSES
========================================================= */

const pulses = [];


for (
    let i = 0;
    i < 5;
    i++
) {

    const geometry =
        new THREE.SphereGeometry(
            0.055,
            8,
            8
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0xF5F5F7,

            transparent: true,

            opacity: 0
        });


    const pulse =
        new THREE.Mesh(
            geometry,
            material
        );


    pulse.userData.edge =
        i %
        attentionLines.length;


    pulse.userData.progress =
        Math.random();


    world.add(pulse);


    pulses.push(pulse);
}


/* =========================================================
   EMERGENT STRUCTURE
========================================================= */

const structureGroup =
    new THREE.Group();


structureGroup.visible =
    false;


world.add(
    structureGroup
);


const structurePoints = [

    [
        -2.2,
        1.0,
        0
    ],

    [
        -0.8,
        2.2,
        0.8
    ],

    [
        1.0,
        1.5,
        -0.3
    ],

    [
        2.3,
        0.3,
        0.7
    ],

    [
        0.4,
        -0.8,
        0
    ]
];


const structureMeshes = [];


for (
    const position
    of structurePoints
) {

    const geometry =
        new THREE.SphereGeometry(
            0.10,
            10,
            10
        );


    const material =
        new THREE.MeshBasicMaterial({

            color: 0xF5F5F7,

            transparent: true,

            opacity: 0
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.set(
        ...position
    );


    structureGroup.add(
        mesh
    );


    structureMeshes.push(
        mesh
    );
}


const structureEdges = [

    [0, 1],
    [1, 2],
    [2, 3],
    [3, 4],
    [4, 0],
    [0, 2],
    [1, 3],
    [2, 4]

];


const structureLines = [];


for (
    const [a, b]
    of structureEdges
) {

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints([

                structureMeshes[a].position,

                structureMeshes[b].position
            ]);


    const material =
        new THREE.LineBasicMaterial({

            color: 0x8E95A8,

            transparent: true,

            opacity: 0
        });


    const line =
        new THREE.Line(
            geometry,
            material
        );


    structureGroup.add(
        line
    );


    structureLines.push(
        line
    );
}


/* =========================================================
   UI
========================================================= */

const title =
    document.getElementById(
        "title"
    );


const subtitle =
    document.getElementById(
        "subtitle"
    );


const equation =
    document.getElementById(
        "equation"
    );


const caption =
    document.getElementById(
        "caption"
    );


/* =========================================================
   UI STATE
========================================================= */

let captionTimer = null;

let equationTimer = null;

let currentCaption = "";

let currentEquation = "";


/* =========================================================
   CAPTION TRANSITION
========================================================= */

function showCaption(
    text
) {

    if (
        currentCaption === text
    ) {
        return;
    }


    currentCaption =
        text;


    if (captionTimer) {

        clearTimeout(
            captionTimer
        );
    }


    caption.style.opacity =
        "0";


    caption.style.transform =
        "translateX(-50%) translateY(10px)";


    captionTimer =
        setTimeout(() => {

            caption.textContent =
                text;


            caption.style.opacity =
                "1";


            caption.style.transform =
                "translateX(-50%) translateY(0)";

        }, 150);
}


/* =========================================================
   EQUATION TRANSITION
========================================================= */

function showEquation(
    text
) {

    if (
        currentEquation === text
    ) {
        return;
    }


    currentEquation =
        text;


    if (equationTimer) {

        clearTimeout(
            equationTimer
        );
    }


    equation.style.opacity =
        "0";


    equation.style.transform =
        "translateX(-50%) translateY(10px)";


    equationTimer =
        setTimeout(() => {

            equation.textContent =
                text;


            equation.style.opacity =
                "1";


            equation.style.transform =
                "translateX(-50%) translateY(0)";

        }, 150);
}


/* =========================================================
   HIDE EQUATION
========================================================= */

function hideEquation() {

    currentEquation =
        "";


    if (equationTimer) {

        clearTimeout(
            equationTimer
        );
    }


    equation.style.opacity =
        "0";
}


/* =========================================================
   EASING
========================================================= */

function easeOutCubic(t) {

    t =
        THREE.MathUtils.clamp(
            t,
            0,
            1
        );


    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


function easeInOutCubic(t) {

    t =
        THREE.MathUtils.clamp(
            t,
            0,
            1
        );


    return t < 0.5

        ? 4 * t * t * t

        : 1 -

        Math.pow(
            -2 * t + 2,
            3
        ) / 2;
}


/* =========================================================
   SCENE STATE
========================================================= */

let currentScene =
    -1;


/* =========================================================
   CLOCK
========================================================= */

const clock =
    new THREE.Clock();


let elapsed =
    0;


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    const dt =
        clock.getDelta();


    elapsed += dt;


    const t =
        elapsed;


    /* =====================================================
       CAMERA
    ===================================================== */

    const theta =
        THREE.MathUtils.degToRad(

            -45 +

            Math.sin(
                t * 0.025
            ) * 2
        );


    const phi =
        THREE.MathUtils.degToRad(
            65
        );


    camera.position.x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


    camera.position.y =
        radius *
        Math.cos(phi);


    camera.position.z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


    camera.lookAt(
        0,
        0.7,
        0
    );


    /* =====================================================
       WORLD ROTATION
    ===================================================== */

    world.rotation.y =
        t * 0.018;


    /* =====================================================
       PARTICLES
    ===================================================== */

    if (
        t < 5
    ) {

        particleMaterial.opacity =
            easeOutCubic(
                t / 4
            ) * 0.5;

    } else {

        particleMaterial.opacity =
            0.35;
    }


    /* =====================================================
       SCENE 1
       0 → 5
    ===================================================== */

    if (
        t < 5
    ) {

        if (
            currentScene !== 0
        ) {

            currentScene =
                0;


            title.style.opacity =
                "1";


            subtitle.style.opacity =
                "1";


            hideEquation();


            showCaption(
                "A word does not always have the same representation."
            );
        }
    }


    /* =====================================================
       SCENE 2
       5 → 11

       RUN₁ = 5s
       RUN₂ = 8s
    ===================================================== */

    else if (
        t < 11
    ) {

        if (
            currentScene !== 1
        ) {

            currentScene =
                1;


            vectorA.visible =
                true;


            vectorB.visible =
                false;


            vectorC.visible =
                false;


            labelA.material.opacity =
                0;


            labelB.material.opacity =
                0;


            labelC.material.opacity =
                0;


            vectorA.line.material.opacity =
                1;

            vectorA.cone.material.opacity =
                1;

            vectorB.line.material.opacity =
                1;

            vectorB.cone.material.opacity =
                1;

            vectorC.line.material.opacity =
                1;

            vectorC.cone.material.opacity =
                1;


            currentEquation =
                "";


            showEquation(
                "RUN₁ ≈ RUN₂"
            );
        }


        /* =================================================
           RUN₁
           5 → 8
        ================================================= */

        vectorA.visible =
            true;


        const progressA =
            easeOutCubic(
                (t - 5) / 3
            );


        /*
         * Shorter vector for 9:16.
         */

        const lengthA =
            3.2 *
            progressA;


        vectorA.setLength(
            lengthA,
            0.34,
            0.16
        );


        updateVectorLabel(
            labelA,
            dirA,
            lengthA
        );


        labelA.material.opacity =
            easeOutCubic(
                (t - 5) / 0.65
            );


        if (
            currentCaption !==
            "RUNNING IN A RACE"
        ) {

            showCaption(
                "RUNNING IN A RACE"
            );
        }


        /* =================================================
           RUN₂
           8 → 11
        ================================================= */

        if (
            t >= 8
        ) {

            vectorB.visible =
                true;


            const progressB =
                easeOutCubic(
                    (t - 8) / 3
                );


            const lengthB =
                3.2 *
                progressB;


            vectorB.setLength(
                lengthB,
                0.34,
                0.16
            );


            updateVectorLabel(
                labelB,
                dirB,
                lengthB
            );


            labelB.material.opacity =
                easeOutCubic(
                    (t - 8) / 0.65
                );


            if (
                currentCaption !==
                "RUNNING A MACHINE"
            ) {

                showCaption(
                    "RUNNING A MACHINE"
                );
            }
        }
    }


    /* =====================================================
       SCENE 3
       11 → 15

       RUN₃ = 11s
    ===================================================== */

    else if (
        t < 15
    ) {

        if (
            currentScene !== 2
        ) {

            currentScene =
                2;


            vectorA.visible =
                true;


            vectorB.visible =
                true;


            vectorC.visible =
                true;


            showEquation(
                "RUN₁ ≈ RUN₂ ≈ RUN₃"
            );
        }


        /* =================================================
           RUN₁
        ================================================= */

        vectorA.setLength(
            3.2,
            0.34,
            0.16
        );


        updateVectorLabel(
            labelA,
            dirA,
            3.2
        );


        labelA.material.opacity =
            1;


        /* =================================================
           RUN₂
        ================================================= */

        vectorB.setLength(
            3.2,
            0.34,
            0.16
        );


        updateVectorLabel(
            labelB,
            dirB,
            3.2
        );


        labelB.material.opacity =
            1;


        /* =================================================
           RUN₃
           11 → 15
        ================================================= */

        vectorC.visible =
            true;


        const progressC =
            easeOutCubic(
                (t - 11) / 3
            );


        const lengthC =
            3.1 *
            progressC;


        vectorC.setLength(
            lengthC,
            0.34,
            0.16
        );


        updateVectorLabel(
            labelC,
            dirC,
            lengthC
        );


        labelC.material.opacity =
            easeOutCubic(
                (t - 11) / 0.65
            );


        if (
            currentCaption !==
            "RUNNING A BUSINESS"
        ) {

            showCaption(
                "RUNNING A BUSINESS"
            );
        }
    }


    /* =====================================================
       SCENE 4
       ATTENTION
       15 → 23
    ===================================================== */

    else if (
        t < 23
    ) {

        if (
            currentScene !== 3
        ) {

            currentScene =
                3;


            hideEquation();


            showCaption(
                "Attention lets tokens exchange information."
            );
        }


        /* =================================================
           VECTOR EXIT
           15 → 17
        ================================================= */

        const exitProgress =
            easeInOutCubic(
                (t - 15) / 2
            );


        const remaining =
            1 -
            exitProgress;


        if (
            t < 17
        ) {

            vectorA.visible =
                true;

            vectorB.visible =
                true;

            vectorC.visible =
                true;


            /* ---------------------------------------------
               Retract shafts
            --------------------------------------------- */

            vectorA.setLength(
                3.2 * remaining,
                0.34,
                0.16
            );


            vectorB.setLength(
                3.2 * remaining,
                0.34,
                0.16
            );


            vectorC.setLength(
                3.1 * remaining,
                0.34,
                0.16
            );


            /* ---------------------------------------------
               Update labels
            --------------------------------------------- */

            updateVectorLabel(
                labelA,
                dirA,
                3.2 * remaining
            );


            updateVectorLabel(
                labelB,
                dirB,
                3.2 * remaining
            );


            updateVectorLabel(
                labelC,
                dirC,
                3.1 * remaining
            );


            /* ---------------------------------------------
               Fade labels
            --------------------------------------------- */

            labelA.material.opacity =
                remaining;


            labelB.material.opacity =
                remaining;


            labelC.material.opacity =
                remaining;


            /* ---------------------------------------------
               Fade shafts
            --------------------------------------------- */

            vectorA.line.material.opacity =
                remaining;


            vectorB.line.material.opacity =
                remaining;


            vectorC.line.material.opacity =
                remaining;


            /* ---------------------------------------------
               Fade arrow heads independently

               The tips disappear smoothly instead of
               remaining visible until the very end.
            --------------------------------------------- */

            const tipProgress =
                easeInOutCubic(
                    (t - 15) / 1.15
                );


            const tipOpacity =
                1 -
                tipProgress;


            vectorA.cone.material.opacity =
                tipOpacity;


            vectorB.cone.material.opacity =
                tipOpacity;


            vectorC.cone.material.opacity =
                tipOpacity;

        } else {

            /* ---------------------------------------------
               Complete cleanup
            --------------------------------------------- */

            vectorA.visible =
                false;

            vectorB.visible =
                false;

            vectorC.visible =
                false;


            vectorA.line.material.opacity =
                0;

            vectorB.line.material.opacity =
                0;

            vectorC.line.material.opacity =
                0;


            vectorA.cone.material.opacity =
                0;

            vectorB.cone.material.opacity =
                0;

            vectorC.cone.material.opacity =
                0;


            labelA.material.opacity =
                0;

            labelB.material.opacity =
                0;

            labelC.material.opacity =
                0;
        }


        /* =================================================
           TOKENS
        ================================================= */

        const tokenProgress =
            easeOutCubic(
                (t - 15) / 2
            );


        for (
            const token
            of tokens
        ) {

            token.scale.setScalar(
                tokenProgress
            );


            token.material.opacity =
                tokenProgress;
        }


        /* =================================================
           ATTENTION LINES
        ================================================= */

        const lineProgress =
            easeOutCubic(
                (t - 16) / 3
            );


        for (
            const line
            of attentionLines
        ) {

            line.material.opacity =
                lineProgress *
                0.32;
        }
    }


    /* =====================================================
       SCENE 5
       INFORMATION FLOW
       23 → 27
    ===================================================== */

    else if (
        t < 27
    ) {

        if (
            currentScene !== 4
        ) {

            currentScene =
                4;


            showCaption(
                "Each token incorporates information from others."
            );
        }


        /* =================================================
           Tokens
        ================================================= */

        for (
            const token
            of tokens
        ) {

            token.scale.setScalar(
                1
            );


            token.material.opacity =
                1;
        }


        /* =================================================
           Attention lines
        ================================================= */

        for (
            const line
            of attentionLines
        ) {

            line.material.opacity =
                0.28;
        }


        /* =================================================
           Pulses
        ================================================= */

        for (
            const pulse
            of pulses
        ) {

            const line =
                attentionLines[
                    pulse.userData.edge
                ];


            pulse.userData.progress +=
                dt * 0.35;


            if (
                pulse.userData.progress >= 1
            ) {

                pulse.userData.progress =
                    0;
            }


            const position =
                line.geometry
                    .attributes
                    .position;


            const ax =
                position.getX(0);

            const ay =
                position.getY(0);

            const az =
                position.getZ(0);


            const bx =
                position.getX(1);

            const by =
                position.getY(1);

            const bz =
                position.getZ(1);


            const p =
                pulse.userData.progress;


            pulse.position.set(

                THREE.MathUtils.lerp(
                    ax,
                    bx,
                    p
                ),

                THREE.MathUtils.lerp(
                    ay,
                    by,
                    p
                ),

                THREE.MathUtils.lerp(
                    az,
                    bz,
                    p
                )
            );


            pulse.material.opacity =
                0.8;
        }
    }


    /* =====================================================
       SCENE 6
       EMERGENT GEOMETRY
       27+
    ===================================================== */

    else {

        if (
            currentScene !== 5
        ) {

            currentScene =
                5;


            showEquation(
                "VECTOR SPACE + TRAINING → STRUCTURE"
            );


            showCaption(
                "Training can create geometric structure."
            );


            structureGroup.visible =
                true;
        }


        /* =================================================
           Fade attention
        ================================================= */

        const attentionFade =
            easeInOutCubic(
                (t - 27) / 2
            );


        const attentionOpacity =
            1 -
            attentionFade;


        for (
            const token
            of tokens
        ) {

            token.material.opacity =
                attentionOpacity;
        }


        for (
            const line
            of attentionLines
        ) {

            line.material.opacity =
                0.28 *
                attentionOpacity;
        }


        for (
            const pulse
            of pulses
        ) {

            pulse.material.opacity =
                attentionOpacity *
                0.8;
        }


        /* =================================================
           Emergent structure
        ================================================= */

        const structureProgress =
            easeOutCubic(
                (t - 27) / 2.5
            );


        for (
            const point
            of structureMeshes
        ) {

            point.material.opacity =
                structureProgress;
        }


        for (
            const line
            of structureLines
        ) {

            line.material.opacity =
                structureProgress *
                0.65;
        }
    }


    /* =====================================================
       RENDER
    ===================================================== */

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   START
========================================================= */

animate();

</script>

</body>

</html>
