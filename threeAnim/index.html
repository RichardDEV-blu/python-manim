<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doxing · Cómo funciona el web scraping a escala</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070d; overflow: hidden;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #dff6ff;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* viñeta */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.9) 100%);
  }

  #caption {
    position: fixed; left: 50%; bottom: 12%;
    transform: translateX(-50%) translateY(16px);
    max-width: min(920px, 88vw);
    text-align: center;
    font-size: clamp(16px, 2.35vw, 31px);
    font-weight: 600;
    line-height: 1.34;
    letter-spacing: 0.2px;
    color: #e6faff;
    text-shadow: 0 2px 26px rgba(0,0,0,0.95), 0 0 44px rgba(46,230,200,0.22);
    opacity: 0;
    transition: opacity .55s ease, transform .55s ease, color .4s ease;
    padding: 0 14px;
    pointer-events: none;
    z-index: 10;
  }
  #caption.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #caption.warn { color: #ffb4b4; text-shadow: 0 2px 26px rgba(0,0,0,0.95), 0 0 48px rgba(255,90,90,0.35); }

  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,0.06); z-index: 10;
  }
  #bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2ee6c8, #4aa8ff, #b06bff);
    box-shadow: 0 0 14px rgba(46,230,200,0.7);
    transition: width .1s linear;
  }

  #tag {
    position: fixed; left: 18px; top: 16px; z-index: 10;
    font-size: 11px; letter-spacing: 2.6px; text-transform: uppercase;
    color: rgba(126,249,224,0.55);
    font-weight: 700;
    pointer-events: none;
  }
  #tag span { color: rgba(255,255,255,0.28); font-weight: 500; letter-spacing: 1.6px; }

  #replay {
    position: fixed; right: 18px; top: 14px; z-index: 12;
    background: rgba(10,22,34,0.7);
    border: 1px solid rgba(126,249,224,0.35);
    color: #7ef9e0;
    font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .2s, box-shadow .2s, color .2s;
  }
  #replay:hover {
    background: rgba(46,230,200,0.15);
    box-shadow: 0 0 22px rgba(46,230,200,0.35);
    color: #ffffff;
  }

  #note {
    position: fixed; right: 18px; bottom: 18px; z-index: 10;
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(255,255,255,0.22); pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="tag">OSINT / SCRAPING <span>· animación educativa</span></div>
<button id="replay">Reiniciar</button>
<div id="caption"></div>
<div id="hud"><div id="bar"></div></div>
<div id="note">Contenido educativo sobre privacidad digital</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ══════════════════════════════════════════════════════════════
   UTILIDADES
   ══════════════════════════════════════════════════════════════ */
const clamp = THREE.MathUtils.clamp;
function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* Texturas generadas por canvas */
const circleTex = (() => {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
})();

const glowTex = (() => {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,0.95)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.45)');
  grd.addColorStop(0.5, 'rgba(255,255,255,0.12)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
})();

/* Mini "página web" falsa */
function makeSiteCanvas(seed) {
  const W = 256, H = 320;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);

  g.fillStyle = '#08111b'; g.fillRect(0, 0, W, H);

  // barra de navegador
  g.fillStyle = '#0f1c2c'; g.fillRect(0, 0, W, 28);
  const dots = ['#ff5f57', '#febc2e', '#28c840'];
  dots.forEach((col, i) => {
    g.fillStyle = col;
    g.beginPath(); g.arc(16 + i * 15, 14, 4.5, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = '#17293f'; roundRect(g, 62, 7, W - 76, 14, 7); g.fill();

  // cabecera de perfil
  g.fillStyle = '#102138'; g.fillRect(0, 28, W, 56);
  g.fillStyle = '#1c4a66';
  g.beginPath(); g.arc(38, 56, 18, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#2f6f92';
  g.beginPath(); g.arc(38, 50, 7, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(38, 74, 12, Math.PI, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(140,215,255,0.55)'; g.fillRect(66, 44, 92, 9);
  g.fillStyle = 'rgba(90,150,195,0.45)'; g.fillRect(66, 62, 62, 7);

  // líneas de texto
  let y = 100;
  for (let i = 0; i < 7; i++) {
    const w = 55 + rnd() * 150;
    g.fillStyle = `rgba(120,180,220,${0.12 + rnd() * 0.22})`;
    g.fillRect(16, y, w, 7);
    y += 15;
    if (rnd() > 0.7) y += 7;
  }

  // bloques de imagen
  const gy = 218;
  for (let i = 0; i < 3; i++) {
    for (let j = 0; j < 2; j++) {
      const bx = 16 + i * 78, by = gy + j * 46;
      g.fillStyle = `rgba(${40 + rnd() * 60 | 0},${110 + rnd() * 90 | 0},${150 + rnd() * 90 | 0},0.55)`;
      roundRect(g, bx, by, 68, 38, 4); g.fill();
      g.strokeStyle = 'rgba(120,220,255,0.25)'; g.lineWidth = 1; g.stroke();
    }
  }
  return c;
}

function makeTileCanvas(seed) {
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  g.fillStyle = '#0a1522'; g.fillRect(0, 0, S, S);
  g.fillStyle = 'rgba(70,170,220,0.55)'; g.fillRect(0, 0, S, 9);
  for (let i = 0; i < 5; i++) {
    g.fillStyle = `rgba(110,190,235,${0.12 + rnd() * 0.25})`;
    g.fillRect(6, 16 + i * 9, 16 + rnd() * 36, 5);
  }
  g.strokeStyle = 'rgba(46,230,200,0.45)'; g.lineWidth = 2;
  g.strokeRect(1, 1, S - 2, S - 2);
  return c;
}

/* Etiqueta de texto en sprite */
function makeLabel(text, opts = {}) {
  const color = opts.color || '#7ef9e0';
  const bg = opts.bg || 'rgba(6,13,22,0.82)';
  const border = opts.border || color.replace(')', ',0.5)').replace('rgb', 'rgba');
  const fontSize = opts.fontSize || 52;

  const c = document.createElement('canvas');
  let g = c.getContext('2d');
  const font = `700 ${fontSize}px "Inter", "Segoe UI", system-ui, sans-serif`;
  g.font = font;
  const pad = 30;
  const w = Math.ceil(g.measureText(text).width) + pad * 2;
  const h = fontSize + pad * 1.1;
  c.width = w; c.height = h;

  g = c.getContext('2d');
  g.font = font;
  roundRect(g, 2, 2, w - 4, h - 4, 16);
  g.fillStyle = bg; g.fill();
  g.strokeStyle = border; g.lineWidth = 2.5; g.stroke();

  g.fillStyle = color;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = color;
  g.shadowBlur = 18;
  g.fillText(text, w / 2, h / 2 + 2);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, depthTest: false, opacity: 0
  });
  const sp = new THREE.Sprite(mat);
  const k = 0.0105;
  sp.scale.set(w * k, h * k, 1);
  sp.renderOrder = 20;
  return sp;
}

/* ══════════════════════════════════════════════════════════════
   ESCENA
   ══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 3, 28);

const world = new THREE.Group();
scene.add(world);

/* ── Polvo ambiental ─────────────────────────────────────────── */
const DUST_N = 1500;
{
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(DUST_N * 3);
  for (let i = 0; i < DUST_N; i++) {
    const r = 14 + Math.random() * 48;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.62;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.3, map: circleTex, color: 0x2a6f9e, transparent: true,
    opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  const dust = new THREE.Points(geo, mat);
  dust.name = 'dust';
  world.add(dust);
}

/* ── Núcleo (base de datos) ──────────────────────────────────── */
const core = new THREE.Group();
world.add(core);

const coreInner = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.05, 2),
  new THREE.MeshBasicMaterial({ color: 0x0b2b3c, transparent: true, opacity: 0.95 })
);
core.add(coreInner);

const coreWire = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.35, 1),
  new THREE.MeshBasicMaterial({ color: 0x2ee6c8, wireframe: true, transparent: true, opacity: 0.55 })
);
core.add(coreWire);

const coreRings = [];
for (let i = 0; i < 3; i++) {
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(1.85 + i * 0.5, 0.012, 6, 96),
    new THREE.MeshBasicMaterial({ color: 0x2ee6c8, transparent: true, opacity: 0.32 })
  );
  r.rotation.x = Math.PI / 2 + i * 0.55;
  r.rotation.y = i * 0.8;
  core.add(r);
  coreRings.push(r);
}

const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x2ee6c8, transparent: true, opacity: 0.42,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
coreGlow.scale.set(11, 11, 1);
core.add(coreGlow);

/* ── Paneles de sitios web ───────────────────────────────────── */
const panelGroup = new THREE.Group();
world.add(panelGroup);

const PANEL_N = 6;
const panels = [];
for (let i = 0; i < PANEL_N; i++) {
  const ang = (i / PANEL_N) * Math.PI * 2 + 0.35;
  const rad = 9.2;
  const px = Math.cos(ang) * rad;
  const pz = Math.sin(ang) * rad;
  const py = Math.sin(i * 2.1) * 2.3;

  const tex = new THREE.CanvasTexture(makeSiteCanvas(101 + i * 17));
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.5), mat);
  mesh.position.set(px, py, pz);
  mesh.lookAt(0, py, 0);
  panelGroup.add(mesh);

  const frameMat = new THREE.LineBasicMaterial({ color: 0x2ee6c8, transparent: true, opacity: 0 });
  const frame = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.16, 2.66)), frameMat
  );
  frame.position.copy(mesh.position);
  frame.quaternion.copy(mesh.quaternion);
  panelGroup.add(frame);

  panels.push({ mesh, mat, frameMat, pos: mesh.position.clone(), quat: mesh.quaternion.clone() });
}

/* ── Orbes scraper ───────────────────────────────────────────── */
function makeOrb(color) {
  const g = new THREE.Group();
  const matCore = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
  const matCage = new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.75 });
  const matGlow = new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  const inner = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), matCore);
  const cage = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), matCage);
  const glow = new THREE.Sprite(matGlow);
  glow.scale.set(2.4, 2.4, 1);

  g.add(inner, cage, glow);
  g.userData = { mats: [matCore, matCage, matGlow], inner, cage, glow };
  return g;
}

const mainOrb = makeOrb(0x7ef9e0);
mainOrb.position.set(0, 0, 6);
world.add(mainOrb);

/* enjambre (fase de escala) */
const swarm = new THREE.Group();
swarm.visible = false;
world.add(swarm);
const swarmOrbs = [];
for (let i = 0; i < 9; i++) {
  const o = makeOrb(i % 3 === 0 ? 0xffd479 : 0x7ef9e0);
  const a = (i / 9) * Math.PI * 2;
  o.userData.angle = a;
  o.userData.radius = 11 + Math.random() * 7;
  o.userData.speed = 0.12 + Math.random() * 0.18;
  o.userData.yOff = (Math.random() - 0.5) * 7;
  swarm.add(o);
  swarmOrbs.push(o);
}

/* ── Mosaico de "miles de fuentes" ───────────────────────────── */
const TILE_N = 620;
const tileTex = new THREE.CanvasTexture(makeTileCanvas(7));
const tileMat = new THREE.MeshBasicMaterial({
  map: tileTex, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
});
const tiles = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.0, 1.2), tileMat, TILE_N);
{
  const dummy = new THREE.Object3D();
  for (let i = 0; i < TILE_N; i++) {
    const r = 19 + Math.pow(Math.random(), 0.7) * 24;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    dummy.position.set(
      r * Math.sin(ph) * Math.cos(th),
      r * Math.cos(ph) * 0.78,
      r * Math.sin(ph) * Math.sin(th)
    );
    dummy.lookAt(0, 0, 0);
    dummy.updateMatrix();
    tiles.setMatrixAt(i, dummy.matrix);
  }
  tiles.instanceMatrix.needsUpdate = true;
}
world.add(tiles);

/* ── Sistema de partículas (datos) ───────────────────────────── */
const PARTICLE_MAX = 4000;
const pGeo = new THREE.BufferGeometry();
const posArr = new Float32Array(PARTICLE_MAX * 3);
const colArr = new Float32Array(PARTICLE_MAX * 3);
const sizeArr = new Float32Array(PARTICLE_MAX);
const alphaArr = new Float32Array(PARTICLE_MAX);

pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(colArr, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizeArr, 1));
pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alphaArr, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 500 } },
  vertexShader: /* glsl */`
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / max(0.001, -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float a = smoothstep(0.5, 0.03, d);
      float al = a * vAlpha;
      if (al < 0.008) discard;
      gl_FragColor = vec4(vColor, al);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false;
world.add(pPoints);

const particles = [];
for (let i = 0; i < PARTICLE_MAX; i++) {
  particles.push({
    active: false, t: 0, dur: 1, size: 0.25, alpha: 0,
    from: new THREE.Vector3(), to: new THREE.Vector3(),
    ctrl: new THREE.Vector3(), color: new THREE.Color()
  });
}
let pCursor = 0;

const _v1 = new THREE.Vector3();
const _white = new THREE.Color(0xffffff);

function spawnParticle(from, to, colorHex) {
  let slot = -1;
  for (let i = 0; i < 220; i++) {
    const idx = (pCursor + i) % PARTICLE_MAX;
    if (!particles[idx].active) { slot = idx; break; }
  }
  if (slot === -1) slot = pCursor;
  pCursor = (slot + 1) % PARTICLE_MAX;

  const p = particles[slot];
  p.active = true;
  p.from.copy(from);
  p.to.copy(to);
  _v1.randomDirection().multiplyScalar(1.4 + Math.random() * 2.8);
  p.ctrl.copy(from).add(to).multiplyScalar(0.5).add(_v1);
  p.t = 0;
  p.dur = 0.85 + Math.random() * 0.85;
  p.size = 0.16 + Math.random() * 0.34;
  p.color.setHex(colorHex).lerp(_white, Math.random() * 0.35);
}

function burst(from, count, colorHex, spread) {
  for (let i = 0; i < count; i++) {
    _v1.randomDirection().multiplyScalar(spread * Math.random());
    const src = from.clone().add(_v1);
    spawnParticle(src, new THREE.Vector3(0, 0, 0), colorHex);
  }
}

/* ── Anillos de escaneo ──────────────────────────────────────── */
const ringGeo = new THREE.RingGeometry(0.86, 1.0, 56);
const ringFX = [];
function spawnRing(pos, quat, color) {
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.95, side: THREE.DoubleSide,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  const m = new THREE.Mesh(ringGeo, mat);
  m.position.copy(pos);
  m.quaternion.copy(quat);
  m.scale.setScalar(0.2);
  world.add(m);
  ringFX.push({ mesh: m, life: 0, dur: 0.95 });
}

/* ── Etiquetas ───────────────────────────────────────────────── */
const formatLabels = [
  { sp: makeLabel('{ } JSON', { color: '#ffd479' }), pos: new THREE.Vector3(3.3, 2.0, 0.8), t: 35.4 },
  { sp: makeLabel('CSV', { color: '#7ef9e0' }), pos: new THREE.Vector3(-3.5, 0.7, 1.4), t: 36.8 },
  { sp: makeLabel('DATABASE', { color: '#8fb8ff' }), pos: new THREE.Vector3(0.6, -2.9, 2.2), t: 38.2 }
];
formatLabels.forEach(f => { f.sp.position.copy(f.pos); world.add(f.sp); });

const CATEGORIES = [
  { text: 'NOMBRES', color: '#7ef9e0', t: 51.2, angle: 0.0, y: 1.4 },
  { text: 'EMPLEOS', color: '#ffd479', t: 52.6, angle: 1.6, y: -0.9 },
  { text: 'FOTOS', color: '#ff8fc8', t: 54.0, angle: 3.2, y: 1.9 },
  { text: 'UBICACIONES', color: '#8fffa8', t: 55.4, angle: 4.7, y: -1.5 }
];
const catLabels = CATEGORIES.map(c => {
  const sp = makeLabel(c.text, { color: c.color, fontSize: 46 });
  world.add(sp);
  return { ...c, sp };
});

/* ══════════════════════════════════════════════════════════════
   GUIÓN
   ══════════════════════════════════════════════════════════════ */
const CAPTIONS = [
  { t: 0.0,  d: 5.0, text: '¿Cómo se puede hacer doxing con tecnología?' },
  { t: 5.2,  d: 6.0, text: 'No necesitas ser un hacker.' },
  { t: 11.4, d: 6.4, text: 'Solo hay que automatizar la recolección de información que ya es pública.' },
  { t: 18.0, d: 4.6, text: 'Ahí entra el web scraping.' },
  { t: 22.8, d: 6.4, text: 'Un scraper es un programa que visita sitios web y descarga su contenido.' },
  { t: 29.4, d: 5.6, text: 'Busca los datos que le interesan y los guarda automáticamente.' },
  { t: 35.2, d: 5.0, text: 'Como JSON, CSV o en una base de datos.' },
  { t: 40.4, d: 4.8, text: 'Ahora imagina hacerlo a escala.' },
  { t: 45.4, d: 5.4, text: 'Cientos o miles de fuentes a la vez.' },
  { t: 51.0, d: 6.0, text: 'Nombres. Empleos. Fotos. Ubicaciones.' },
  { t: 57.2, d: 6.4, text: 'Cualquier cosa que alguien haya publicado públicamente.' },
  { t: 63.8, d: 8.2, text: 'La misma información que compartes sin pensarlo puede reconstruirte por completo.', warn: true }
];
const TOTAL = 72;

const CAM_KEYS = [
  { t: 0,  p: [0, 3.0, 28],  l: [0, 0.4, 0] },
  { t: 12, p: [1, 3.5, 23],  l: [0, 0.5, 0] },
  { t: 20, p: [8, 5.0, 14],  l: [0, 0.4, 0] },
  { t: 30, p: [-7, 4.0, 15], l: [0, 0.4, 0] },
  { t: 38, p: [0, 6.0, 22],  l: [0, 0.0, 0] },
  { t: 45, p: [0, 9.0, 42],  l: [0, 0.0, 0] },
  { t: 51, p: [0, 4.0, 16],  l: [0, 0.3, 0] },
  { t: 59, p: [7, 3.0, 12.5],l: [0, 0.3, 0] },
  { t: 66, p: [-6, 2.6, 12], l: [0, 0.3, 0] },
  { t: 72, p: [0, 2.0, 16],  l: [0, 0.3, 0] }
];

const _camP = new THREE.Vector3();
const _camL = new THREE.Vector3();

function cameraAt(t) {
  let i = 0;
  while (i < CAM_KEYS.length - 1 && t > CAM_KEYS[i + 1].t) i++;
  const a = CAM_KEYS[i];
  const b = CAM_KEYS[Math.min(i + 1, CAM_KEYS.length - 1)];
  const span = Math.max(0.001, b.t - a.t);
  const k = smoothstep(0, 1, clamp((t - a.t) / span, 0, 1));

  _camP.set(
    a.p[0] + (b.p[0] - a.p[0]) * k,
    a.p[1] + (b.p[1] - a.p[1]) * k,
    a.p[2] + (b.p[2] - a.p[2]) * k
  );
  _camL.set(
    a.l[0] + (b.l[0] - a.l[0]) * k,
    a.l[1] + (b.l[1] - a.l[1]) * k,
    a.l[2] + (b.l[2] - a.l[2]) * k
  );
}

/* ══════════════════════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════════════════════ */
let elapsed = 0;
let playing = true;
let nextScrape = 16.6;
let corePulseVal = 0;
let collected = 0;
let scaleSpawnAcc = 0;
const pending = [];
const orbTarget = new THREE.Vector3(0, 0, 6);
const _tmpM = new THREE.Matrix4();
const _tmpV = new THREE.Vector3();

function later(delay, fn) { pending.push({ at: elapsed + delay, fn }); }

function doScrape() {
  const p = panels[Math.floor(Math.random() * panels.length)];
  orbTarget.copy(p.pos).multiplyScalar(0.68);
  const origin = p.pos.clone().multiplyScalar(0.92);
  spawnRing(p.pos, p.quat, 0x7ef9e0);
  later(0.5, () => burst(origin, 20, 0x7ef9e0, 0.45));
}

/* ══════════════════════════════════════════════════════════════
   ACTUALIZACIÓN
   ══════════════════════════════════════════════════════════════ */
const captionEl = document.getElementById('caption');
const barEl = document.getElementById('bar');
let currentCaption = -2;

function updateCaption(t) {
  let idx = -1;
  for (let i = 0; i < CAPTIONS.length; i++) {
    if (t >= CAPTIONS[i].t && t < CAPTIONS[i].t + CAPTIONS[i].d) { idx = i; break; }
  }
  if (idx !== currentCaption) {
    currentCaption = idx;
    if (idx === -1) {
      captionEl.classList.remove('show');
    } else {
      captionEl.textContent = CAPTIONS[idx].text;
      captionEl.classList.toggle('warn', !!CAPTIONS[idx].warn);
      captionEl.classList.add('show');
    }
  }
}

function setGroupOpacity(group, o) {
  group.traverse(obj => {
    if (obj.material && obj.material.transparent) obj.material.opacity = o;
  });
}

function update(t, dt) {
  /* ── Cámara ── */
  cameraAt(t);
  const shake = 0.12;
  camera.position.set(
    _camP.x + Math.sin(t * 0.37) * shake,
    _camP.y + Math.sin(t * 0.53 + 1.3) * shake * 0.8,
    _camP.z + Math.cos(t * 0.29) * shake * 0.6
  );
  camera.lookAt(_camL.x, _camL.y, _camL.z);

  /* ── Subtítulos ── */
  updateCaption(t);
  barEl.style.width = `${clamp(t / TOTAL, 0, 1) * 100}%`;

  /* ── Acciones programadas ── */
  for (let i = pending.length - 1; i >= 0; i--) {
    if (t >= pending[i].at) {
      const fn = pending[i].fn;
      pending.splice(i, 1);
      fn();
    }
  }

  /* ── Polvo ── */
  const dust = world.getObjectByName('dust');
  if (dust) {
    dust.rotation.y = t * 0.018;
    dust.rotation.x = Math.sin(t * 0.05) * 0.05;
  }

  /* ── Núcleo ── */
  const coreAppear = smoothstep(1.5, 5, t);
  core.visible = coreAppear > 0.01;
  coreRings.forEach((r, i) => {
    r.rotation.z += dt * (0.35 + i * 0.18) * (i % 2 ? -1 : 1);
    r.rotation.x += dt * 0.12;
  });
  coreWire.rotation.y += dt * 0.28;
  coreWire.rotation.x += dt * 0.14;
  coreInner.rotation.y -= dt * 0.18;

  corePulseVal *= Math.exp(-4.2 * dt);
  const coreScale = (1 + Math.min(1.0, collected * 0.0009)) * (1 + corePulseVal * 0.35);
  core.scale.setScalar(coreScale * (0.5 + coreAppear * 0.5));
  coreGlow.material.opacity = (0.22 + coreAppear * 0.25 + corePulseVal * 0.5) * (0.4 + coreAppear * 0.6);

  /* ── Paneles ── */
  const panelOpacity = smoothstep(13, 18, t) * (1 - smoothstep(42, 48, t));
  panels.forEach((p, i) => {
    p.mat.opacity = panelOpacity * 0.95;
    p.frameMat.opacity = panelOpacity * 0.5 * (0.6 + 0.4 * Math.sin(t * 2 + i));
    p.mesh.lookAt(0, p.mesh.position.y, 0);
  });

  /* ── Scraper principal ── */
  const orbVisible = smoothstep(15, 17, t) * (1 - smoothstep(42, 47, t));
  mainOrb.visible = orbVisible > 0.01;
  setGroupOpacity(mainOrb, orbVisible);
  if (orbVisible > 0.01) {
    const k = 1 - Math.exp(-3.4 * dt);
    mainOrb.position.lerp(orbTarget, k);
    mainOrb.userData.cage.rotation.y += dt * 2.4;
    mainOrb.userData.cage.rotation.x += dt * 1.6;
    mainOrb.userData.glow.material.opacity = orbVisible * (0.6 + 0.35 * Math.sin(t * 6));
  }

  if (t > 16.6 && t < 40) {
    if (t >= nextScrape) {
      doScrape();
      nextScrape += 1.85 + Math.random() * 0.5;
    }
  }

  /* ── Anillos ── */
  for (let i = ringFX.length - 1; i >= 0; i--) {
    const r = ringFX[i];
    r.life += dt / r.dur;
    if (r.life >= 1) {
      world.remove(r.mesh);
      r.mesh.material.dispose();
      ringFX.splice(i, 1);
      continue;
    }
    const s = 0.25 + r.life * 3.4;
    r.mesh.scale.setScalar(s);
    r.mesh.material.opacity = 0.9 * (1 - r.life) * (1 - r.life);
  }

  /* ── Mosaico de fuentes ── */
  const tileOpacity = smoothstep(40, 46, t) * (1 - smoothstep(64, 71, t));
  tileMat.opacity = tileOpacity * 0.72;
  tiles.visible = tileOpacity > 0.005;
  if (tiles.visible) tiles.rotation.y = t * 0.012;

  /* ── Enjambre ── */
  const swarmOpacity = smoothstep(41, 47, t) * (1 - smoothstep(64, 70, t));
  swarm.visible = swarmOpacity > 0.01;
  if (swarm.visible) {
    swarmOrbs.forEach((o, i) => {
      o.userData.angle += dt * o.userData.speed;
      const a = o.userData.angle;
      const r = o.userData.radius;
      o.position.set(Math.cos(a) * r, o.userData.yOff + Math.sin(t * 0.7 + i) * 1.2, Math.sin(a) * r);
      o.userData.cage.rotation.y += dt * 3;
      o.userData.cage.rotation.z += dt * 1.4;
      o.userData.glow.material.opacity = swarmOpacity * (0.55 + 0.35 * Math.sin(t * 5 + i));
      o.userData.mats[0].opacity = swarmOpacity;
      o.userData.mats[1].opacity = swarmOpacity * 0.75;
    });
  }

  /* ── Flujo masivo de datos ── */
  if (t > 41 && t < 63.5) {
    const rate = 60 + smoothstep(44, 52, t) * 130;
    scaleSpawnAcc += dt * rate;
    let guard = 0;
    while (scaleSpawnAcc >= 1 && guard < 60) {
      scaleSpawnAcc -= 1;
      guard++;
      const idx = Math.floor(Math.random() * TILE_N);
      tiles.getMatrixAt(idx, _tmpM);
      _tmpV.setFromMatrixPosition(_tmpM);
      spawnParticle(_tmpV, new THREE.Vector3(0, 0, 0),
        Math.random() > 0.75 ? 0xffd479 : 0x4ab8ff);
    }
  }

  /* ── Partículas ── */
  for (let i = 0; i < PARTICLE_MAX; i++) {
    const p = particles[i];
    if (!p.active) {
      alphaArr[i] = 0;
      continue;
    }
    p.t += dt / p.dur;
    if (p.t >= 1) {
      p.active = false;
      alphaArr[i] = 0;
      collected++;
      corePulseVal = Math.min(1, corePulseVal + 0.035);
      continue;
    }
    const tt = p.t, mt = 1 - tt;
    const x = mt * mt * p.from.x + 2 * mt * tt * p.ctrl.x + tt * tt * p.to.x;
    const y = mt * mt * p.from.y + 2 * mt * tt * p.ctrl.y + tt * tt * p.to.y;
    const z = mt * mt * p.from.z + 2 * mt * tt * p.ctrl.z + tt * tt * p.to.z;
    posArr[i * 3] = x;
    posArr[i * 3 + 1] = y;
    posArr[i * 3 + 2] = z;
    colArr[i * 3] = p.color.r;
    colArr[i * 3 + 1] = p.color.g;
    colArr[i * 3 + 2] = p.color.b;
    sizeArr[i] = p.size;
    alphaArr[i] = Math.min(1, tt * 6) * Math.min(1, (1 - tt) * 3.2) * 0.95;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;

  /* ── Etiquetas de formato ── */
  formatLabels.forEach(f => {
    const o = smoothstep(f.t, f.t + 1.2, t) * (1 - smoothstep(44, 49, t));
    f.sp.material.opacity = o;
    f.sp.position.y = f.pos.y + Math.sin(t * 1.3 + f.pos.x) * 0.12;
    f.sp.visible = o > 0.01;
  });

  /* ── Categorías orbitando ── */
  catLabels.forEach((c, i) => {
    const o = smoothstep(c.t, c.t + 1.4, t) * (1 - smoothstep(70, 74, t));
    c.sp.material.opacity = o;
    c.sp.visible = o > 0.01;
    const a = c.angle + t * 0.12;
    const r = 5.0;
    c.sp.position.set(
      Math.cos(a) * r,
      c.y + Math.sin(t * 0.9 + i) * 0.35,
      Math.sin(a) * r
    );
  });

  /* ── Zoom de cierre ── */
  if (t > 63) {
    const f = smoothstep(63, 70, t);
    coreGlow.material.opacity *= 1 - f * 0.35;
  }
}

/* ══════════════════════════════════════════════════════════════
   BUCLE
   ══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    elapsed += dt;
    if (elapsed > TOTAL + 1.5) elapsed = TOTAL + 1.5;
  }
  update(elapsed, dt);
  renderer.render(scene, camera);
}

/* ══════════════════════════════════════════════════════════════
   RESIZE
   ══════════════════════════════════════════════════════════════ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  const dpr = renderer.getPixelRatio();
  pMat.uniforms.uScale.value = h * dpr * 0.5;
}
window.addEventListener('resize', onResize);
onResize();

/* ══════════════════════════════════════════════════════════════
   REINICIO
   ══════════════════════════════════════════════════════════════ */
document.getElementById('replay').addEventListener('click', () => {
  elapsed = 0;
  playing = true;
  nextScrape = 16.6;
  corePulseVal = 0;
  collected = 0;
  scaleSpawnAcc = 0;
  pCursor = 0;
  currentCaption = -2;
  pending.length = 0;

  particles.forEach(p => { p.active = false; });
  for (let i = 0; i < PARTICLE_MAX; i++) alphaArr[i] = 0;

  ringFX.forEach(r => { world.remove(r.mesh); r.mesh.material.dispose(); });
  ringFX.length = 0;

  mainOrb.position.set(0, 0, 6);
  orbTarget.set(0, 0, 6);
  captionEl.classList.remove('show');
});

/* Arranque */
animate();
</script>
