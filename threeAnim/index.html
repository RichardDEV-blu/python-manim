<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Scraping · The pipeline</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
      color: #ede9fe;
    }
    :root { --stage-scale: 1; }
    #stage {
      position: fixed; left: 50%; top: 50%;
      width: 1080px; height: 1920px;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center;
      background: #0a0614; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.15), 0 0 120px rgba(168, 85, 247, 0.18);
      isolation: isolate;
    }
    #app { position: absolute; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #tag {
      position: absolute; left: 18px; top: 22px; z-index: 10;
      font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase;
      color: rgba(196, 181, 253, 0.7); font-weight: 700;
      pointer-events: none; line-height: 1.5;
    }
    #recBtn {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      background: rgba(30, 15, 55, 0.85);
      border: 1px solid rgba(255, 90, 90, 0.55);
      color: #ffb4b4; font-family: inherit;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 10px 18px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 8px;
      transition: background .2s, box-shadow .2s;
    }
    #recBtn:hover {
      background: rgba(255, 90, 90, 0.2);
      box-shadow: 0 0 22px rgba(255, 90, 90, 0.4);
    }
    #recBtn .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ff5a5a; box-shadow: 0 0 10px #ff5a5a;
    }
    #recBtn:disabled { opacity: 0.55; cursor: not-allowed; }
    #recStatus {
      position: fixed; top: 68px; right: 20px; z-index: 9999;
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #c4b5fd; background: rgba(10, 6, 20, 0.75);
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(8px); display: none;
    }
    #recStatus.show { display: block; }
  </style>
</head>

<body>
  <div id="stage">
    <div id="app"></div>
  </div>

  <button id="recBtn"><span class="dot"></span><span id="recLabel">Record</span></button>
  <div id="recStatus"></div>

  <script src="https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    await Promise.all([
      document.fonts.load('500 16px Montserrat'),
      document.fonts.load('600 16px Montserrat'),
      document.fonts.load('700 16px Montserrat'),
      document.fonts.load('800 16px Montserrat')
    ]);

    const clamp = THREE.MathUtils.clamp;
    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function roundRect(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
      g.closePath();
    }

    /* ══ AUDIO ══ */
    let audioCtx = null;
    let audioEnabled = true;
    let IS_RECORDING = false;
    const audioEvents = [];

    const _noiseBufs = new WeakMap();
    function getNoiseBuffer(ctx) {
      if (_noiseBufs.has(ctx)) return _noiseBufs.get(ctx);
      const len = Math.ceil(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      _noiseBufs.set(ctx, buf);
      return buf;
    }
    function scheduleWhoosh(ctx, t0, intensity) {
      const dur = 0.45;
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.8;
      bp.frequency.setValueAtTime(180, t0);
      bp.frequency.exponentialRampToValueAtTime(3400, t0 + dur * 0.4);
      bp.frequency.exponentialRampToValueAtTime(200, t0 + dur);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(intensity, t0 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      noise.connect(bp).connect(gain).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + dur + 0.05);
    }
    function scheduleBoom(ctx, t0, intensity) {
      const dur = 1.8;
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(140, t0);
      sub.frequency.exponentialRampToValueAtTime(32, t0 + dur * 0.85);
      const subGain = ctx.createGain();
      subGain.gain.setValueAtTime(0.0001, t0);
      subGain.gain.linearRampToValueAtTime(intensity, t0 + 0.015);
      subGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      sub.connect(subGain).connect(ctx.destination);
      sub.start(t0); sub.stop(t0 + dur + 0.05);
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2200, t0);
      lp.frequency.exponentialRampToValueAtTime(90, t0 + 0.5);
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(intensity * 0.6, t0);
      nGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      noise.connect(lp).connect(nGain).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + 0.6);
    }
    function scheduleBlip(ctx, t0, intensity = 0.15, baseFreq = 800) {
      const dur = 0.18;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, t0 + dur * 0.5);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.75, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }
    function scheduleGlitch(ctx, t0, intensity = 0.25) {
      const dur = 0.22;
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 9;
      bp.frequency.value = 900 + Math.random() * 1400;
      const g = ctx.createGain();
      g.gain.setValueAtTime(intensity, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      noise.connect(bp).connect(g).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + dur + 0.05);
    }
    function scheduleDrone(ctx, t0, duration, intensity) {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, t0);
      osc.frequency.linearRampToValueAtTime(82, t0 + duration);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(180, t0);
      lp.frequency.linearRampToValueAtTime(700, t0 + duration);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + duration * 0.75);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(lp).connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + duration + 0.05);
    }
    function scheduleTick(ctx, t0, intensity = 0.12) {
      const dur = 0.05;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1800, t0);
      osc.frequency.exponentialRampToValueAtTime(700, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(intensity, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    function scheduleRiser(ctx, t0, intensity = 0.18) {
      const dur = 1.1;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(90, t0);
      osc.frequency.exponentialRampToValueAtTime(1400, t0 + dur);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(400, t0);
      lp.frequency.exponentialRampToValueAtTime(4500, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + dur * 0.85);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(lp).connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }
    function scheduleChime(ctx, t0, intensity = 0.18, baseFreq = 523) {
      const dur = 1.4;
      const o1 = ctx.createOscillator(); o1.type = 'sine';
      o1.frequency.setValueAtTime(baseFreq, t0);
      const o2 = ctx.createOscillator(); o2.type = 'sine';
      o2.frequency.setValueAtTime(baseFreq * 1.5, t0);
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.0001, t0);
      g1.gain.linearRampToValueAtTime(intensity, t0 + 0.01);
      g1.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, t0);
      g2.gain.linearRampToValueAtTime(intensity * 0.5, t0 + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.7);
      o1.connect(g1).connect(ctx.destination);
      o2.connect(g2).connect(ctx.destination);
      o1.start(t0); o1.stop(t0 + dur + 0.05);
      o2.start(t0); o2.stop(t0 + dur + 0.05);
    }
    function scheduleStatic(ctx, t0, intensity = 0.18) {
      const dur = 0.16;
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 3200;
      const g = ctx.createGain();
      g.gain.setValueAtTime(intensity, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      noise.connect(hp).connect(g).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + dur + 0.02);
    }
    function scheduleThump(ctx, t0, intensity = 0.4) {
      const dur = 0.65;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(85, t0);
      osc.frequency.exponentialRampToValueAtTime(38, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }
    function scheduleAudioEvent(ctx, type, t0, params = {}) {
      switch (type) {
        case 'whoosh': scheduleWhoosh(ctx, t0, params.intensity ?? 0.15); break;
        case 'boom': scheduleBoom(ctx, t0, params.intensity ?? 0.4); break;
        case 'blip': scheduleBlip(ctx, t0, params.intensity ?? 0.15, params.freq ?? 800); break;
        case 'glitch': scheduleGlitch(ctx, t0, params.intensity ?? 0.25); break;
        case 'drone': scheduleDrone(ctx, t0, params.duration ?? 6, params.intensity ?? 0.06); break;
        case 'tick': scheduleTick(ctx, t0, params.intensity ?? 0.12); break;
        case 'riser': scheduleRiser(ctx, t0, params.intensity ?? 0.18); break;
        case 'chime': scheduleChime(ctx, t0, params.intensity ?? 0.18, params.freq ?? 523); break;
        case 'static': scheduleStatic(ctx, t0, params.intensity ?? 0.18); break;
        case 'thump': scheduleThump(ctx, t0, params.intensity ?? 0.4); break;
      }
    }
    function triggerAudio(type, params) {
      audioEvents.push({ time: elapsed, type, params });
      if (audioCtx && audioEnabled && !IS_RECORDING) {
        scheduleAudioEvent(audioCtx, type, audioCtx.currentTime + 0.01, params);
      }
    }
    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { console.warn('Audio not available', e); }
    }
    document.addEventListener('pointerdown', initAudio, { once: true });
    document.addEventListener('keydown', initAudio, { once: true });

    /* ══ RENDERER ══ */
    const renderer = new THREE.WebGLRenderer({
      antialias: true, powerPreference: 'high-performance',
      alpha: false, stencil: false, depth: true,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    if ('samples' in renderer) renderer.samples = 4;
    document.getElementById('app').appendChild(renderer.domElement);

    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

    const circleTex = (() => {
      const s = 256, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();
    const glowTex = (() => {
      const s = 1024, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,0.98)');
      grd.addColorStop(0.14, 'rgba(255,255,255,0.55)');
      grd.addColorStop(0.4, 'rgba(255,255,255,0.18)');
      grd.addColorStop(0.7, 'rgba(255,255,255,0.04)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();

    function makeLabel(text, opts = {}) {
      const color = opts.color || '#c4b5fd';
      const bg = opts.bg || 'rgba(15,8,32,0.88)';
      const fontSize = opts.fontSize || 52;
      const lineHeight = opts.lineHeight ?? 1.25;
      const borderAlpha = opts.borderAlpha ?? 0.45;
      const SS = 3;
      const lines = String(text).split('\n');
      const n = lines.length;

      const mc = document.createElement('canvas');
      const mg = mc.getContext('2d');
      const font = `700 ${fontSize}px "Montserrat", "Segoe UI", system-ui, sans-serif`;
      mg.font = font;
      const pad = opts.pad ?? 30;
      let maxW = 0;
      for (const line of lines) {
        const w = mg.measureText(line).width;
        if (w > maxW) maxW = w;
      }
      const w = Math.ceil(maxW) + pad * 2;
      const lineH = fontSize * lineHeight;
      const contentH = lineH * (n - 1) + fontSize;
      const h = contentH + pad * 1.1;

      const c = document.createElement('canvas');
      c.width = w * SS; c.height = h * SS;
      const g = c.getContext('2d');
      g.scale(SS, SS);
      g.font = font;
      roundRect(g, 2, 2, w - 4, h - 4, opts.radius ?? 16);
      g.fillStyle = bg; g.fill();
      g.strokeStyle = color;
      g.globalAlpha = borderAlpha; g.lineWidth = opts.lineWidth ?? 2.5; g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = color;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = color;
      g.shadowBlur = opts.shadowBlur ?? 18;

      const firstY = h / 2 + (fontSize - contentH) / 2;
      for (let i = 0; i < n; i++) {
        g.fillText(lines[i], w / 2, firstY + lineH * i + 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = MAX_ANISO;
      tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({
        map: tex, transparent: true, depthWrite: false, depthTest: false, opacity: 0
      });
      const sp = new THREE.Sprite(mat);
      const k = opts.scaleK ?? 0.0105;
      sp.scale.set(w * k, h * k, 1);
      sp.renderOrder = 20;
      return sp;
    }

    /* ══ SCENE ══ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0614);

    const camera = new THREE.PerspectiveCamera(52, 1080 / 1920, 0.1, 400);
    camera.position.set(0, 0, 22);

    const world = new THREE.Group();
    scene.add(world);

    const vignetteMat = new THREE.ShaderMaterial({
      uniforms: {
        uIntensity: { value: 0.92 },
        uTint: { value: new THREE.Color(0x000000) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: `
        uniform float uIntensity;
        uniform vec3 uTint;
        varying vec2 vUv;
        void main() {
          vec2 uv = vUv - 0.5;
          uv.x *= 1.08;
          float d = length(uv);
          float v = smoothstep(0.42, 0.92, d) * uIntensity;
          gl_FragColor = vec4(uTint, v);
        }
      `,
      transparent: true, depthTest: false, depthWrite: false, toneMapped: false
    });
    const vignetteQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vignetteMat);
    vignetteQuad.frustumCulled = false;
    vignetteQuad.renderOrder = 9999;
    scene.add(vignetteQuad);

    const DUST_N = 5000;
    {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(DUST_N * 3);
      for (let i = 0; i < DUST_N; i++) {
        const r = 8 + Math.random() * 28;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph) * 0.9;
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.22, map: circleTex, color: 0x7c3aed, transparent: true,
        opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      });
      const dust = new THREE.Points(geo, mat);
      dust.name = 'dust';
      world.add(dust);
    }

    /* ══ LAYOUT ══ */
    const NODE_POS = [
      new THREE.Vector3(0,  5.5, 0),
      new THREE.Vector3(0,  3.2, 0),
      new THREE.Vector3(0,  0.9, 0),
      new THREE.Vector3(0, -1.4, 0)
    ];

    /* ══ FRAGMENTOS ══ */
    const FRAGMENT_TEXTS = [
      '<html>', 'href=', 'JSON', 'GET',
      'IP', 'email', 'cookie', 'photo',
      'data-*', 'src=', '@user', 'id#'
    ];
    const fragments = [];
    FRAGMENT_TEXTS.forEach((txt, i) => {
      const sp = makeLabel(txt, {
        color: '#c4b5fd', fontSize: 56, pad: 26, radius: 16,
        borderAlpha: 0.42, shadowBlur: 16, scaleK: 0.0095
      });
      sp.visible = false;
      world.add(sp);
      fragments.push({
        sprite: sp,
        startX: (Math.random() - 0.5) * 8.0,
        startY: 10.5 + Math.random() * 3.5,
        startT: 0.2 + i * 0.28 + Math.random() * 0.25,
        fallDur: 1.8 + Math.random() * 0.9,
        endY: NODE_POS[0].y + 0.15,
        spin: (Math.random() - 0.5) * 0.4,
        curveSeed: Math.random() * Math.PI * 2,
        curveAmp: 0.6 + Math.random() * 1.2
      });
    });

    /* ═══════════════════════════════════════════════════════════════
       NODOS DEL PIPELINE — cada uno con una FIGURA DIFERENTE:
       0. DOWNLOAD      → Cono invertido (flecha de descarga)
       1. PARSE         → Octaedro (división / fragmentación)
       2. CLEAN+TRANS   → Toroide (filtro / circulación)
       3. STORE         → Discos apilados (base de datos)
       ═══════════════════════════════════════════════════════════════ */
    const NODE_INFO = [
      { text: 'DOWNLOAD', colorHex: 0xa855f7, cssColor: '#c4b5fd', appear: 5.6 },
      { text: 'PARSE',    colorHex: 0xc084fc, cssColor: '#d8b4fe', appear: 7.1 },
      { text: 'CLEAN + TRANSFORM', colorHex: 0xd8b4fe, cssColor: '#e9d5ff', appear: 8.6 },
      { text: 'STORE',    colorHex: 0xe879f9, cssColor: '#f5d0fe', appear: 10.1 }
    ];

    const pipelineNodes = [];
    NODE_INFO.forEach((info, i) => {
      const g = new THREE.Group();
      g.position.copy(NODE_POS[i]);

      const wireMat = new THREE.MeshBasicMaterial({
        color: info.colorHex, wireframe: true, transparent: true, opacity: 0
      });
      const edgeMat = new THREE.LineBasicMaterial({

      p.to.copy(to);
      const cAmt = curveAmt ?? (1.0 + Math.random() * 2.4);
      _v1.randomDirection().multiplyScalar(cAmt);

    /* ══ CAMERA ══ */

    function cameraAt(t) {
      let i = 0;
      while (i < CAM_KEYS.length - 1 && t > CAM_KEYS[i + 1].t) i++;
      const a = CAM_KEYS[i];
      const b = CAM_KEYS[Math.min(i + 1, CAM_KEYS.length - 1)];
      const span = Math.max(0.001, b.t - a.t);
      const k = smoothstep(0, 1, clamp((t - a.t) / span, 0, 1));
      _camP.set(
        a.p[0] + (b.p[0] - a.p[0]) * k,
        a.p[1] + (b.p[1] - a.p[1]) * k,
        a.p[2] + (b.p[2] - a.p[2]) * k
      );
      _camL.set(
        a.l[0] + (b.l[0] - a.l[0]) * k,
        a.l[1] + (b.l[1] - a.l[1]) * k,
        a.l[2] + (b.l[2] - a.l[2]) * k
      );
    }

    const firedAudioEvents = new Set();

    /* ══ STATE ══ */
    let elapsed = 0;
    let playing = true;
    let corePulseVal = 0;
    let collected = 0;
    let particleAcc = 0;
    let pipelineFlowAcc = 0;

    /* ══ UPDATE ══ */
    function update(t, dt) {
      cameraAt(t);
      const shake = 0.08;
      camera.position.set(
        _camP.x + Math.sin(t * 0.45) * shake,
        _camP.y + Math.sin(t * 0.61 + 1.3) * shake * 0.8,
        _camP.z + Math.cos(t * 0.33) * shake * 0.6
      );
      camera.lookAt(_camL.x, _camL.y, _camL.z);

      AUDIO_EVENTS.forEach((e, idx) => {
        if (t >= e.at && !firedAudioEvents.has(idx)) {
          firedAudioEvents.add(idx);
          triggerAudio(e.type, e);
        }
      });

      const dust = world.getObjectByName('dust');
      if (dust) {
        dust.rotation.y = t * 0.03 + Math.sin(t * 0.1) * 0.2;
        dust.rotation.x = Math.sin(t * 0.07) * 0.06;
      }

      const darkK = smoothstep(22, 30, t);
      scene.background = new THREE.Color(0x0a0614).lerp(new THREE.Color(0x1a0308), darkK);
      vignetteMat.uniforms.uTint.value.setRGB(darkK * 0.16, 0, 0.02 * darkK);
      vignetteMat.uniforms.uIntensity.value = 0.92 + darkK * 0.05;

      /* Fragmentos */
      const fragGlobalFade = 1 - smoothstep(5.2, 5.9, t);
      fragments.forEach(f => {
        const fallK = smoothstep(f.startT, f.startT + f.fallDur, t);
        if (fallK <= 0.001 || fallK >= 1.0) {
          f.sprite.material.opacity = 0;
          f.sprite.visible = false;
          return;
        }
        f.sprite.visible = true;
        const wave = Math.sin(fallK * Math.PI * 2 + f.curveSeed) * f.curveAmp * (1 - fallK);
        const x = f.startX * (1 - fallK) + wave * 0.4;
        const y = f.startY + (f.endY - f.startY) * fallK;
        f.sprite.position.set(x, y, 0);
        const opa = smoothstep(0, 0.10, fallK) * (1 - smoothstep(0.70, 1.0, fallK));
        f.sprite.material.opacity = opa * 0.92 * fragGlobalFade;
        f.sprite.material.rotation = f.spin * fallK;
      });

      /* Nodos pipeline — cada figura rota diferente */
      const pipelineFade = 1 - smoothstep(21, 24, t);
      pipelineNodes.forEach((n, i) => {
        const appK = smoothstep(n.info.appear, n.info.appear + 0.7, t);
        n.wireMat.opacity = appK * 0.7 * pipelineFade;
        n.edgeMat.opacity = appK * 0.95 * pipelineFade;
        n.innerMat.opacity = appK * 0.7 * pipelineFade;
        const breath = 0.7 + 0.3 * Math.sin(t * 2.2 + i);
        n.glowMat.opacity = appK * breath * 0.5 * pipelineFade;
        const pulse = 1 + corePulseVal * 0.08;
        n.group.scale.setScalar((0.001 + easeOutCubic(appK) * 0.999) * pulse);

        // Rotaciones específicas por figura
        if (i === 0) {
          // Cono: solo Y (mantiene orientación hacia abajo)
          n.wire.rotation.y += dt * 0.8 * n.spinDir;
          n.edges.rotation.y = n.wire.rotation.y;
          n.inner.rotation.y -= dt * 0.6;
        } else if (i === 1) {
          // Octaedro: Y + X
          n.wire.rotation.y += dt * 0.7 * n.spinDir;
          n.wire.rotation.x += dt * 0.4;
          n.edges.rotation.copy(n.wire.rotation);
          n.inner.rotation.y -= dt * 0.9;
          n.inner.rotation.x += dt * 0.5;
        } else if (i === 2) {
          // Toroide: Y + Z
          n.wire.rotation.y += dt * 0.7 * n.spinDir;
          n.wire.rotation.z += dt * 0.35;
          n.edges.rotation.copy(n.wire.rotation);
          n.inner.rotation.y -= dt * 0.5;
          n.inner.rotation.z += dt * 0.4;
        } else {
          // Discos apilados: solo Y (como un tocadiscos)
          n.wire.rotation.y += dt * 0.6 * n.spinDir;
          n.edges.rotation.y = n.wire.rotation.y;
          n.inner.rotation.y -= dt * 0.5;
        }

        n.label.material.opacity = appK * 0.95 * pipelineFade;
        n.label.visible = appK > 0.01 && pipelineFade > 0.01;
        const bob = Math.sin(t * 1.1 + i * 0.7) * 0.04;
        n.group.position.y = n.basePos.y + bob;
        n.label.position.y = n.labelBaseY + bob;
      });

      connectors.forEach((c, i) => {
        const appK = smoothstep(c.appear + 0.3, c.appear + 1.0, t);
        const flow = 0.55 + 0.35 * Math.sin(t * 3 + i);
        c.mat.opacity = appK * flow * 0.6 * pipelineFade;
      });

      if (t > 6.5 && t < 21) {
        for (let i = 0; i < 3; i++) {
          const fromReady = smoothstep(NODE_INFO[i].appear + 0.3, NODE_INFO[i].appear + 1.0, t);
          const toReady = smoothstep(NODE_INFO[i + 1].appear + 0.3, NODE_INFO[i + 1].appear + 1.0, t);
          const src = NODE_POS[i].clone();
          const dst = NODE_POS[i + 1].clone();
          src.x += (Math.random() - 0.5) * 0.4;
          src.z += (Math.random() - 0.5) * 0.4;
          dst.x += (Math.random() - 0.5) * 0.4;
          dst.z += (Math.random() - 0.5) * 0.4;
          pipelineFlowAcc += dt * (14 + i * 4) * fromReady * toReady;
          let guard = 0;
          while (pipelineFlowAcc >= 1 && guard < 30) {
            pipelineFlowAcc -= 1; guard++;
            const col = BENIGN_PALETTE[Math.floor(Math.random() * BENIGN_PALETTE.length)];
            spawnParticle(src, dst, col, 0.12 + Math.random() * 0.35);
          }
        }
      }

      const pivotK = smoothstep(14.5, 15.5, t) * (1 - smoothstep(16.8, 17.4, t));
      pivotLabel.material.opacity = pivotK * 0.95;
      pivotLabel.visible = pivotK > 0.01;
      pivotLabel.position.y = -3.3 + Math.sin(t * 0.9) * 0.06;

      respLabels.forEach(r => {
        const k = smoothstep(r.t, r.t + 0.7, t) * (1 - smoothstep(19.5, 20.5, t));
        r.sp.material.opacity = k;
        r.sp.visible = k > 0.01;
        r.sp.position.y = r.y + Math.sin(t * 1.2 + r.x) * 0.05;
      });

      const splitK = smoothstep(20.0, 22.5, t);
      const benignShrink = smoothstep(24.0, 29.0, t);
      const malGrow = smoothstep(24.0, 28.0, t);
      const centerK = smoothstep(27.0, 30.5, t);

      const benignX = -1.65 * splitK;
      const malX = 1.65 * splitK * (1 - centerK);

      benignOrb.position.set(benignX, SPLIT_Y, 0);
      maliciousOrb.position.set(malX, SPLIT_Y, 0);

      benignOrb.scale.setScalar(splitK * (1 - benignShrink * 0.95));
      maliciousOrb.scale.setScalar(splitK * (1 + malGrow * 0.7) * (1 - centerK * 0.85));

      benignOrb.userData.wireMat.opacity = splitK * (1 - benignShrink) * 0.85;
      maliciousOrb.userData.wireMat.opacity = splitK * (0.85 + malGrow * 0.15) * (1 - centerK);
      benignOrb.userData.glowMat.opacity = splitK * (1 - benignShrink) * (0.6 + 0.3 * Math.sin(t * 7));
      maliciousOrb.userData.glowMat.opacity = splitK * (0.7 + 0.35 * Math.sin(t * 6 + 1)) * (1 - centerK);

      benignOrb.userData.wire.rotation.y += dt * 1.1;
      benignOrb.userData.wire.rotation.x += dt * 0.7;
      maliciousOrb.userData.wire.rotation.y -= dt * 1.6;
      maliciousOrb.userData.wire.rotation.x += dt * 1.0;

      const benLblK = splitK * (1 - smoothstep(27, 29.5, t));
      benignLabel.material.opacity = benLblK;
      benignLabel.visible = benLblK > 0.01;
      benignLabel.position.x = -1.65 - benignShrink * 1.5;
      benignLabel.position.y = SPLIT_Y - 1.55 + Math.sin(t * 1.1) * 0.05;

      const malLblK = splitK * (1 - centerK);
      maliciousLabel.material.opacity = malLblK;
      maliciousLabel.visible = malLblK > 0.01;
      maliciousLabel.position.x = 1.65 * (1 - centerK);
      maliciousLabel.position.y = SPLIT_Y - 1.55 + Math.sin(t * 1.2 + 1) * 0.05;

      if (t > 21.5 && t < 28) {
        particleAcc += dt * 130;
        let guard = 0;
        while (particleAcc >= 1 && guard < 60) {
          particleAcc -= 1; guard++;
          const toBenign = Math.random() > 0.5;
          const target = toBenign ? benignOrb.position.clone() : maliciousOrb.position.clone();
          _v1.randomDirection().multiplyScalar(1.0 + Math.random() * 2.5);
          const src = new THREE.Vector3(0, -1.5, 0).add(_v1);
          const palette = toBenign ? BENIGN_PALETTE : MALICIOUS_PALETTE;
          spawnParticle(src, target,
            palette[Math.floor(Math.random() * palette.length)]);
        }
      }

      const aiK = smoothstep(28.0, 31.0, t);
      const aiPulse = 1 + corePulseVal * 0.35 + 0.05 * Math.sin(t * 3.2);
      aiCore.scale.setScalar((0.001 + easeOutCubic(aiK) * 0.999) * aiPulse);
      aiCore.visible = aiK > 0.005;

      const aiRevealK = smoothstep(28.3, 31.5, t);
      aiWireMat.uniforms.uReveal.value = aiRevealK;
      const aiWireOp = smoothstep(28.3, 30.0, t) * 0.8;
      const aiBreath = 0.9 + 0.1 * Math.sin(t * 1.8);
      aiWireMat.uniforms.uOpacity.value = aiWireOp * aiBreath;

      aiInnerMat.opacity = smoothstep(29.5, 31.5, t) * 0.95;
      aiGlowMat.opacity = smoothstep(28.5, 30.5, t) * 0.45 + corePulseVal * 0.5 * aiK;
      aiGlowMat.color.setHex(0xff2e63).lerp(new THREE.Color(0xff8fa3),
        0.5 + 0.5 * Math.sin(t * 2.0));

      aiWire.rotation.y = t * 0.4;
      aiWire.rotation.x = Math.sin(t * 0.5) * 0.25;
      aiInner.rotation.y -= dt * 0.25;
      aiInner.rotation.z += dt * 0.08;

      aiRings.forEach((r, i) => {
        const d = 28.5 + i * 0.4;
        const rt = clamp((t - d) / 1.0, 0, 1);
        const e = easeOutCubic(rt);
        r.mat.opacity = e * 0.4 * aiK;
        r.mesh.scale.setScalar(0.001 + e * 0.999);
        r.mesh.rotation.z += dt * r.speed;
        r.mesh.rotation.y += Math.sin(t * 0.4 + i) * 0.004;
      });

      if (t > 29 && t < 34) {
        particleAcc += dt * 180;
        let guard = 0;
        while (particleAcc >= 1 && guard < 80) {
          particleAcc -= 1; guard++;
          _v1.randomDirection().multiplyScalar(4 + Math.random() * 4);
          const src = _v1.clone();
          src.y += -2;
          spawnParticle(src, aiCore.position.clone(),
            MALICIOUS_PALETTE[Math.floor(Math.random() * MALICIOUS_PALETTE.length)]);
        }
      }

      const aiLblK = smoothstep(29.5, 31.0, t) * (1 - smoothstep(32.5, 33.5, t));
      aiLabel.material.opacity = aiLblK;
      aiLabel.visible = aiLblK > 0.01;
      aiLabel.position.y = SPLIT_Y - 2.5 + Math.sin(t * 0.9) * 0.06;

      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) { alphaArr[i] = 0; continue; }
        p.t += dt / p.dur;
        if (p.t >= 1) {
          p.active = false; alphaArr[i] = 0; collected++;
          corePulseVal = Math.min(1, corePulseVal + 0.02);
          continue;
        }
        const tt = p.t, mt = 1 - tt;
        let x = mt * mt * p.from.x + 2 * mt * tt * p.ctrl.x + tt * tt * p.to.x;
        let y = mt * mt * p.from.y + 2 * mt * tt * p.ctrl.y + tt * tt * p.to.y;
        let z = mt * mt * p.from.z + 2 * mt * tt * p.ctrl.z + tt * tt * p.to.z;
        const w = Math.sin(tt * p.wobbleFreq + p.wobblePhase) * p.wobble * Math.sin(tt * Math.PI);
        x += w * 0.6; y += w * 0.9;
        posArr[i * 3] = x;
        posArr[i * 3 + 1] = y;
        posArr[i * 3 + 2] = z;
        colArr[i * 3] = p.color.r;
        colArr[i * 3 + 1] = p.color.g;
        colArr[i * 3 + 2] = p.color.b;
        sizeArr[i] = p.size;
        alphaArr[i] = Math.min(1, tt * 6) * Math.min(1, (1 - tt) * 3.2) * 0.95;
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.aColor.needsUpdate = true;
      pGeo.attributes.aSize.needsUpdate = true;
      pGeo.attributes.aAlpha.needsUpdate = true;

      corePulseVal *= Math.exp(-5.0 * dt);

      const closeFade = smoothstep(32.0, 33.5, t);
      closingLabel.material.opacity = closeFade;
      closingLabel.visible = closeFade > 0.01;
      closingLabel.position.y = SPLIT_Y - 3.9 + Math.sin(t * 0.8) * 0.08;
    }

    /* ══ RECORDING ══ */
    const AUTO_RECORD = new URLSearchParams(location.search).get('record') === '1';
    const FPS = 60;
    const recBtn = document.getElementById('recBtn');
    const recLabel = document.getElementById('recLabel');
    const recStatus = document.getElementById('recStatus');

    function setStatus(txt) { recStatus.textContent = txt; recStatus.classList.add('show'); }
    function hideStatus() { recStatus.classList.remove('show'); }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function audioBufferToWav(buffer) {
      const numCh = buffer.numberOfChannels;
      const len = buffer.length;
      const sr = buffer.sampleRate;
      const bytesPerSample = 2;
      const blockAlign = numCh * bytesPerSample;
      const dataSize = len * blockAlign;
      const bufferSize = 44 + dataSize;
      const ab = new ArrayBuffer(bufferSize);
      const view = new DataView(ab);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);
      let offset = 44;
      const channels = [];
      for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
      for (let i = 0; i < len; i++) {
        for (let c = 0; c < numCh; c++) {
          let s = Math.max(-1, Math.min(1, channels[c][i]));
          s = s < 0 ? s * 0x8000 : s * 0x7FFF;
          view.setInt16(offset, s, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: 'audio/wav' });
    }

    async function renderAudioTrack() {
      const sr = 44100;
      const totalDur = TOTAL + 4.0;
      const ctx = new OfflineAudioContext(2, Math.ceil(totalDur * sr), sr);
      for (const ev of audioEvents) {
        scheduleAudioEvent(ctx, ev.type, ev.time, ev.params);
      }
      const rendered = await ctx.startRendering();
      return audioBufferToWav(rendered);
    }

    async function runRecording() {
      recBtn.disabled = true;
      recLabel.textContent = 'Recording';
      audioEnabled = false;
      IS_RECORDING = true;

      audioEvents.length = 0;
      elapsed = 0;
      corePulseVal = 0;
      collected = 0;
      particleAcc = 0;
      pipelineFlowAcc = 0;
      pCursor = 0;
      firedAudioEvents.clear();

      particles.forEach(p => { p.active = false; });
      for (let i = 0; i < PARTICLE_MAX; i++) alphaArr[i] = 0;

      await new Promise(r => setTimeout(r, 200));

      if (typeof CCapture === 'undefined') {
        setStatus('ERROR: CCapture no cargó');
        recBtn.disabled = false; IS_RECORDING = false;
        return;
      }
      setStatus('Iniciando grabador...');

      const capturer = new CCapture({
        format: 'webm', framerate: FPS, quality: 100,
        name: 'scraping-pipeline', verbose: false
      });

      capturer.start();
      const totalFrames = Math.ceil((TOTAL + 1.5) * FPS);

      for (let frame = 0; frame <= totalFrames; frame++) {
        elapsed = Math.min(frame / FPS, TOTAL + 1.5);
        update(elapsed, 1 / FPS);
        renderer.render(scene, camera);
        capturer.capture(renderer.domElement);
        if (frame % 15 === 0) {
          setStatus(`Render ${frame}/${totalFrames} · ${Math.round((frame / totalFrames) * 100)}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }

      setStatus('Codificando video...');
      capturer.stop();
      capturer.save();
      await new Promise(r => setTimeout(r, 800));

      setStatus('Generando audio WAV...');
      try {
        const wavBlob = await renderAudioTrack();
        downloadBlob(wavBlob, 'scraping-pipeline.wav');
      } catch (e) { console.error('Audio render failed', e); }

      setStatus('✓ Listo · video + wav descargados');
      setTimeout(hideStatus, 4000);
      recBtn.disabled = false;
      recLabel.textContent = 'Record';
      audioEnabled = true;
      IS_RECORDING = false;
    }

    recBtn.addEventListener('click', () => { if (!recBtn.disabled) runRecording(); });
    if (AUTO_RECORD) setTimeout(runRecording, 800);

    /* ══ LOOP ══ */
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (playing && !AUTO_RECORD && !IS_RECORDING) {
        elapsed += dt;
        if (elapsed > TOTAL + 1.5) elapsed = TOTAL + 1.5;
      }
      update(elapsed, dt);
      renderer.render(scene, camera);
    }

    function updateStageScale() {
      const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      document.documentElement.style.setProperty('--stage-scale', s);
    }
    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', () => setTimeout(updateStageScale, 120));
    updateStageScale();

    animate();
  </script>
</body>
