<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Doxing · The darker side</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
      color: #ede9fe;
    }

    :root {
      --stage-scale: 1;
    }

    #stage {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center;
      background: #0a0614;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.15), 0 0 120px rgba(168, 85, 247, 0.18);
      isolation: isolate;
    }

    #app {
      position: absolute;
      inset: 0;
    }

    #app canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #tag {
      position: absolute;
      left: 18px;
      top: 22px;
      z-index: 10;
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(196, 181, 253, 0.7);
      font-weight: 700;
      pointer-events: none;
      line-height: 1.5;
    }

    #recBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(30, 15, 55, 0.85);
      border: 1px solid rgba(255, 90, 90, 0.55);
      color: #ffb4b4;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .2s, box-shadow .2s;
    }

    #recBtn:hover {
      background: rgba(255, 90, 90, 0.2);
      box-shadow: 0 0 22px rgba(255, 90, 90, 0.4);
    }

    #recBtn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5a5a;
      box-shadow: 0 0 10px #ff5a5a;
    }

    #recBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #recStatus {
      position: fixed;
      top: 68px;
      right: 20px;
      z-index: 9999;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c4b5fd;
      background: rgba(10, 6, 20, 0.75);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(8px);
      display: none;
    }

    #recStatus.show {
      display: block;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="app"></div>
    <div id="tag">OSINT / SCRAPING</div>
  </div>

  <button id="recBtn"><span class="dot"></span><span id="recLabel">Record</span></button>
  <div id="recStatus"></div>

  <script src="https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    /* ══ FONT ══ */
    await Promise.all([
      document.fonts.load('500 16px Montserrat'),
      document.fonts.load('600 16px Montserrat'),
      document.fonts.load('700 16px Montserrat'),
      document.fonts.load('800 16px Montserrat')
    ]);

    /* ══ UTILS ══ */
    const clamp = THREE.MathUtils.clamp;
    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function roundRect(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
      g.closePath();
    }

    /* ══ AUDIO SYSTEM — 5 efectos ══ */
    let audioCtx = null;
    let audioEnabled = true;
    let IS_RECORDING = false;
    const audioEvents = [];

    const _noiseBufs = new WeakMap();
    function getNoiseBuffer(ctx) {
      if (_noiseBufs.has(ctx)) return _noiseBufs.get(ctx);
      const len = Math.ceil(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      _noiseBufs.set(ctx, buf);
      return buf;
    }

    function scheduleWhoosh(ctx, t0, intensity) {
      const dur = 0.45;
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.8;
      bp.frequency.setValueAtTime(180, t0);
      bp.frequency.exponentialRampToValueAtTime(3400, t0 + dur * 0.4);
      bp.frequency.exponentialRampToValueAtTime(200, t0 + dur);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(intensity, t0 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      noise.connect(bp).connect(gain).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + dur + 0.05);
    }

    function scheduleBoom(ctx, t0, intensity) {
      const dur = 1.8;
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(140, t0);
      sub.frequency.exponentialRampToValueAtTime(32, t0 + dur * 0.85);
      const subGain = ctx.createGain();
      subGain.gain.setValueAtTime(0.0001, t0);
      subGain.gain.linearRampToValueAtTime(intensity, t0 + 0.015);
      subGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      sub.connect(subGain).connect(ctx.destination);
      sub.start(t0); sub.stop(t0 + dur + 0.05);

      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2200, t0);
      lp.frequency.exponentialRampToValueAtTime(90, t0 + 0.5);
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(intensity * 0.6, t0);
      nGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      noise.connect(lp).connect(nGain).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + 0.6);
    }

    function scheduleBlip(ctx, t0, intensity = 0.15, baseFreq = 800) {
      const dur = 0.18;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, t0 + dur * 0.5);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.75, t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }

    function scheduleGlitch(ctx, t0, intensity = 0.25) {
      const dur = 0.22;
      const noise = ctx.createBufferSource();
      noise.buffer = getNoiseBuffer(ctx);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 9;
      bp.frequency.value = 900 + Math.random() * 1400;
      const g = ctx.createGain();
      g.gain.setValueAtTime(intensity, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      noise.connect(bp).connect(g).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + dur + 0.05);
    }

    function scheduleDrone(ctx, t0, duration, intensity) {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, t0);
      osc.frequency.linearRampToValueAtTime(82, t0 + duration);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(180, t0);
      lp.frequency.linearRampToValueAtTime(700, t0 + duration);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(intensity, t0 + duration * 0.75);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(lp).connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + duration + 0.05);
    }

    function scheduleAudioEvent(ctx, type, t0, params = {}) {
      switch (type) {
        case 'whoosh': scheduleWhoosh(ctx, t0, params.intensity ?? 0.15); break;
        case 'boom': scheduleBoom(ctx, t0, params.intensity ?? 0.4); break;
        case 'blip': scheduleBlip(ctx, t0, params.intensity ?? 0.15, params.freq ?? 800); break;
        case 'glitch': scheduleGlitch(ctx, t0, params.intensity ?? 0.25); break;
        case 'drone': scheduleDrone(ctx, t0, params.duration ?? 6, params.intensity ?? 0.06); break;
      }
    }

    function triggerAudio(type, params) {
      audioEvents.push({ time: elapsed, type, params });
      if (audioCtx && audioEnabled && !IS_RECORDING) {
        scheduleAudioEvent(audioCtx, type, audioCtx.currentTime + 0.01, params);
      }
    }

    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { console.warn('Audio not available', e); }
    }
    document.addEventListener('pointerdown', initAudio, { once: true });
    document.addEventListener('keydown', initAudio, { once: true });

    /* ══ RENDERER ══ */
    const stageEl = document.getElementById('stage');

    const renderer = new THREE.WebGLRenderer({
      antialias: true, powerPreference: 'high-performance',
      alpha: false, stencil: false, depth: true,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    if ('samples' in renderer) renderer.samples = 4;
    document.getElementById('app').appendChild(renderer.domElement);

    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

    /* ══ TEXTURES ══ */
    const circleTex = (() => {
      const s = 256, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();

    const glowTex = (() => {
      const s = 1024, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,0.98)');
      grd.addColorStop(0.14, 'rgba(255,255,255,0.55)');
      grd.addColorStop(0.4, 'rgba(255,255,255,0.18)');
      grd.addColorStop(0.7, 'rgba(255,255,255,0.04)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();

    function makeLabel(text, opts = {}) {
      const color = opts.color || '#c4b5fd';
      const bg = opts.bg || 'rgba(15,8,32,0.88)';
      const fontSize = opts.fontSize || 52;
      const lineHeight = opts.lineHeight ?? 1.25;
      const borderAlpha = opts.borderAlpha ?? 0.45;
      const SS = 3;

      const lines = String(text).split('\n');
      const n = lines.length;

      const mc = document.createElement('canvas');
      const mg = mc.getContext('2d');
      const font = `700 ${fontSize}px "Montserrat", "Segoe UI", system-ui, sans-serif`;
      mg.font = font;
      const pad = opts.pad ?? 30;

      let maxW = 0;
      for (const line of lines) {
        const w = mg.measureText(line).width;
        if (w > maxW) maxW = w;
      }
      const w = Math.ceil(maxW) + pad * 2;
      const lineH = fontSize * lineHeight;
      const contentH = lineH * (n - 1) + fontSize;
      const h = contentH + pad * 1.1;

      const c = document.createElement('canvas');
      c.width = w * SS; c.height = h * SS;
      const g = c.getContext('2d');
      g.scale(SS, SS);
      g.font = font;
      roundRect(g, 2, 2, w - 4, h - 4, opts.radius ?? 16);
      g.fillStyle = bg; g.fill();
      g.strokeStyle = color;
      g.globalAlpha = borderAlpha; g.lineWidth = opts.lineWidth ?? 2.5; g.stroke();
      g.globalAlpha = 1;

      g.fillStyle = color;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = color;
      g.shadowBlur = opts.shadowBlur ?? 18;

      const firstY = h / 2 + (fontSize - contentH) / 2;
      for (let i = 0; i < n; i++) {
        g.fillText(lines[i], w / 2, firstY + lineH * i + 2);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = MAX_ANISO;
      tex.needsUpdate = true;

      const mat = new THREE.SpriteMaterial({
        map: tex, transparent: true, depthWrite: false, depthTest: false, opacity: 0
      });
      const sp = new THREE.Sprite(mat);
      const k = opts.scaleK ?? 0.0105;
      sp.scale.set(w * k, h * k, 1);
      sp.renderOrder = 20;
      return sp;
    }

    /* ══ SCENE ══ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0614);

    const camera = new THREE.PerspectiveCamera(52, 1080 / 1920, 0.1, 400);
    camera.position.set(0, 0, 22);

    const world = new THREE.Group();
    scene.add(world);

    /* Vignette */
    const vignetteMat = new THREE.ShaderMaterial({
      uniforms: {
        uIntensity: { value: 0.92 },
        uTint: { value: new THREE.Color(0x000000) }
      },
      vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
      fragmentShader: `
    uniform float uIntensity;
    uniform vec3 uTint;
    varying vec2 vUv;
    void main() {
      vec2 uv = vUv - 0.5;
      uv.x *= 1.08;
      float d = length(uv);
      float v = smoothstep(0.42, 0.92, d) * uIntensity;
      gl_FragColor = vec4(uTint, v);
    }
  `,
      transparent: true, depthTest: false, depthWrite: false, toneMapped: false
    });
    const vignetteQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vignetteMat);
    vignetteQuad.frustumCulled = false;
    vignetteQuad.renderOrder = 9999;
    scene.add(vignetteQuad);

    /* Dust */
    const DUST_N = 6000;
    {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(DUST_N * 3);
      for (let i = 0; i < DUST_N; i++) {
        const r = 8 + Math.random() * 28;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph) * 0.9;
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.22, map: circleTex, color: 0x7c3aed, transparent: true,
        opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      });
      const dust = new THREE.Points(geo, mat);
      dust.name = 'dust';
      world.add(dust);
    }

    /* ══ FRAGMENTS ══ */
    const FRAGMENT_TEXTS = [
      '1990', 'NYC', '@jdoe', 'photo', 'gmail',
      '+1···', 'dev', '42', 'cats', '24/7',
      '5km', 'amazon', 'school', 'cat.jpg', 'USD',
      'USA', 'likes', 'pizza', 'coffee', 'IT',
      'B.Sc', '5★', 'review', 'friend', 'work',
      'follow', 'tag', 'story', 'check-in', 'bio',
      'CV', '€$', 'sale', 'rss', 'feed'
    ];

    const fragments = [];
    FRAGMENT_TEXTS.forEach((txt, i) => {
      const sp = makeLabel(txt, {
        color: '#c4b5fd',
        fontSize: 34,
        pad: 20,
        radius: 12,
        borderAlpha: 0.35,
        lineWidth: 1.8,
        shadowBlur: 10,
        scaleK: 0.0085
      });
      const r = 5.5 + Math.random() * 4.5;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      sp.position.set(
        r * Math.sin(ph) * Math.cos(th),
        r * Math.cos(ph),
        r * Math.sin(ph) * Math.sin(th)
      );
      world.add(sp);
      fragments.push({
        sprite: sp,
        basePos: sp.position.clone(),
        driftPhase: Math.random() * Math.PI * 2,
        driftFreq: 0.35 + Math.random() * 0.5,
        driftAmp: 0.25 + Math.random() * 0.35,
        spinDir: Math.random() > 0.5 ? 1 : -1,
        startDelay: Math.random() * 0.8
      });
    });

    /* ══ CORE ══ */
    const core = new THREE.Group();
    core.scale.setScalar(0.001);
    world.add(core);

    const coreInnerMat = new THREE.MeshBasicMaterial({ color: 0x2e1065, transparent: true, opacity: 0 });
    const coreInner = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 4), coreInnerMat);
    core.add(coreInner);

    const coreWireMat = new THREE.ShaderMaterial({
      uniforms: {
        uReveal: { value: 0 },
        uOpacity: { value: 0 },
        uColor: { value: new THREE.Color(0xa855f7) },
        uRim: { value: new THREE.Color(0xe879f9) }
      },
      vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
      fragmentShader: `
    uniform float uReveal;
    uniform float uOpacity;
    uniform vec3  uColor;
    uniform vec3  uRim;
    varying vec3  vPos;
    void main() {
      float rNorm = length(vPos) / 1.35;
      float threshold = 1.05 - uReveal * 1.15;
      float reveal = smoothstep(threshold + 0.10, threshold - 0.10, rNorm);
      float distToFront = abs(rNorm - threshold);
      float rim = exp(-distToFront * distToFront * 26.0);
      float revealActive = smoothstep(0.0, 0.08, uReveal) * (1.0 - smoothstep(0.9, 1.0, uReveal));
      float a = max(reveal * 0.9, rim * revealActive) * uOpacity;
      if (a < 0.008) discard;
      vec3 col = uColor + rim * revealActive * uRim * 1.6;
      gl_FragColor = vec4(col, a);
    }
  `,
      wireframe: true, transparent: true, depthWrite: false, blending: THREE.NormalBlending
    });
    const coreWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 3), coreWireMat);
    core.add(coreWire);

    const surfaceDotCount = 260;
    const surfaceDotsGeo = new THREE.BufferGeometry();
    {
      const sdPos = new Float32Array(surfaceDotCount * 3);
      for (let i = 0; i < surfaceDotCount; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / surfaceDotCount);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        const r = 1.42;
        sdPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        sdPos[i * 3 + 1] = r * Math.cos(phi);
        sdPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      surfaceDotsGeo.setAttribute('position', new THREE.BufferAttribute(sdPos, 3));
    }
    const surfaceDotsMat = new THREE.PointsMaterial({
      size: 0.09, map: circleTex, color: 0xe879f9,
      transparent: true, opacity: 0,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    const surfaceDots = new THREE.Points(surfaceDotsGeo, surfaceDotsMat);
    core.add(surfaceDots);

    const coreRings = [];
    const ringParams = [
      { rx: 1.85, tilt: [Math.PI / 2, 0, 0], speed: 0.55, axis: 'z' },
      { rx: 2.25, tilt: [Math.PI / 2 + 0.55, 0.8, 0], speed: -0.42, axis: 'z' },
      { rx: 2.65, tilt: [Math.PI / 2 + 1.1, 1.6, 0.3], speed: 0.30, axis: 'x' },
      { rx: 3.05, tilt: [Math.PI / 2 - 0.7, 2.4, 0.5], speed: -0.25, axis: 'z' },
      { rx: 3.45, tilt: [Math.PI / 2 + 0.2, 3.1, 1.2], speed: 0.20, axis: 'x' }
    ];
    ringParams.forEach(rp => {
      const rMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0 });
      const r = new THREE.Mesh(new THREE.TorusGeometry(rp.rx, 0.012, 12, 256), rMat);
      r.rotation.set(rp.tilt[0], rp.tilt[1], rp.tilt[2]);
      core.add(r);
      coreRings.push({ mesh: r, mat: rMat, speed: rp.speed, axis: rp.axis });
    });

    const coreGlowMat = new THREE.SpriteMaterial({
      map: glowTex, color: 0xa855f7, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const coreGlow = new THREE.Sprite(coreGlowMat);
    coreGlow.scale.set(11, 11, 1);
    core.add(coreGlow);

    /* ══ ORBES — simétricos ══ */
    function makeSmallOrb(color, radius = 0.7) {
      const g = new THREE.Group();
      const wireMat = new THREE.MeshBasicMaterial({
        color, wireframe: true, transparent: true, opacity: 0
      });
      const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(radius, 1), wireMat);
      const glowMat = new THREE.SpriteMaterial({
        map: glowTex, color, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const glow = new THREE.Sprite(glowMat);
      glow.scale.set(4.5, 4.5, 1);
      g.add(wire, glow);
      g.userData = { wireMat, glowMat, wire };
      return g;
    }

    const ORB_X = 2.9;
    const ORB_Y = -1.8;

    const benignOrb = makeSmallOrb(0xc4b5fd, 0.75);
    benignOrb.position.set(-ORB_X, ORB_Y, 0);
    world.add(benignOrb);

    const maliciousOrb = makeSmallOrb(0xff4d6d, 0.75);
    maliciousOrb.position.set(ORB_X, ORB_Y, 0);
    world.add(maliciousOrb);

    /* ══ LABELS SIMÉTRICAS ══
       Ambos lados: mismo Y, misma |X|, mismos tiempos de aparición.
       Y = 3.8, 2.65, 1.5, 0.35  (de arriba a abajo)
       X = ±2.4
       ═══════════════════════════════════════════════════════════════ */
    const LABEL_X = 2.4;
    const LABEL_Y = [3.8, 2.65, 1.5, 0.35];

    const BENIGN_TEXTS = ['PRICE COMPARE', 'SITE MONITOR', 'RESEARCH', 'ANALYTICS'];
    const MAL_TEXTS = ['MASS DATA', 'CONTENT COPY', 'PHISHING', 'DISINFORMATION'];
    const LABEL_TIMES = [14.2, 14.9, 15.6, 16.3];

    const benignLabels = BENIGN_TEXTS.map((txt, i) => {
      const sp = makeLabel(txt, {
        color: '#c4b5fd', fontSize: 28, pad: 20, radius: 14,
        borderAlpha: 0.5, shadowBlur: 14, scaleK: 0.0095
      });
      sp.position.set(-LABEL_X, LABEL_Y[i], 0.5);
      world.add(sp);
      return { text: txt, t: LABEL_TIMES[i], sp, idx: i, baseY: LABEL_Y[i] };
    });

    const maliciousLabels = MAL_TEXTS.map((txt, i) => {
      const sp = makeLabel(txt, {
        color: '#ff6b6b', fontSize: 28, pad: 20, radius: 14,
        borderAlpha: 0.55, shadowBlur: 16, scaleK: 0.0095
      });
      sp.position.set(LABEL_X, LABEL_Y[i], 0.5);
      world.add(sp);
      return { text: txt, t: LABEL_TIMES[i], sp, idx: i, baseY: LABEL_Y[i] };
    });

    /* ── Closing label centrado abajo ── */
    const closingLabel = makeLabel('SAME TOOL.\nDIFFERENT INTENT.', {
      color: '#ff8fa3',
      bg: 'rgba(30,5,15,0.95)',
      fontSize: 38,
      lineHeight: 1.3,
      pad: 30,
      radius: 20,
      borderAlpha: 0.55,
      shadowBlur: 22
    });
    closingLabel.position.set(0, -4.8, 3);
    closingLabel.material.opacity = 0;
    closingLabel.visible = false;
    world.add(closingLabel);

    /* ══ PARTÍCULAS ══ */
    const PARTICLE_MAX = 8000;
    const pGeo = new THREE.BufferGeometry();
    const posArr = new Float32Array(PARTICLE_MAX * 3);
    const colArr = new Float32Array(PARTICLE_MAX * 3);
    const sizeArr = new Float32Array(PARTICLE_MAX);
    const alphaArr = new Float32Array(PARTICLE_MAX);

    pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    pGeo.setAttribute('aColor', new THREE.BufferAttribute(colArr, 3));
    pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizeArr, 1));
    pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alphaArr, 1));

    const pMat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 960 } },
      vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = aColor; vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / max(0.001, -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
      fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float a = smoothstep(0.5, 0.03, d);
      float al = a * vAlpha;
      if (al < 0.008) discard;
      gl_FragColor = vec4(vColor, al);
    }
  `,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const pPoints = new THREE.Points(pGeo, pMat);
    pPoints.frustumCulled = false;
    world.add(pPoints);

    const particles = [];
    for (let i = 0; i < PARTICLE_MAX; i++) {
      particles.push({
        active: false, t: 0, dur: 1, size: 0.25,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        ctrl: new THREE.Vector3(), color: new THREE.Color(),
        wobble: 0, wobbleFreq: 0, wobblePhase: 0
      });
    }
    let pCursor = 0;

    const _v1 = new THREE.Vector3();
    const _white = new THREE.Color(0xffffff);

    const BENIGN_PALETTE = [0xc4b5fd, 0xa78bfa, 0x8b5cf6, 0xd8b4fe, 0xe879f9];
    const MALICIOUS_PALETTE = [0xff4d6d, 0xff2e63, 0xc9184a, 0xff5a5a, 0xff8b8b];

    function spawnParticle(from, to, colorHex) {
      let slot = -1;
      for (let i = 0; i < 300; i++) {
        const idx = (pCursor + i) % PARTICLE_MAX;
        if (!particles[idx].active) { slot = idx; break; }
      }
      if (slot === -1) slot = pCursor;
      pCursor = (slot + 1) % PARTICLE_MAX;
      const p = particles[slot];
      p.active = true;
      p.from.copy(from);
      p.to.copy(to);
      _v1.randomDirection().multiplyScalar(1.2 + Math.random() * 3.4);
      p.ctrl.copy(from).add(to).multiplyScalar(0.5).add(_v1);
      p.t = 0;
      p.dur = 0.55 + Math.random() * 0.75;
      p.size = 0.14 + Math.random() * 0.36;
      p.color.setHex(colorHex).lerp(_white, Math.random() * 0.4);
      p.wobble = 0.15 + Math.random() * 0.45;
      p.wobbleFreq = 6 + Math.random() * 8;
      p.wobblePhase = Math.random() * Math.PI * 2;
    }

    const ringGeo = new THREE.RingGeometry(0.86, 1.0, 200);
    const ringFX = [];
    function spawnRing(pos, quat, color) {
      const mat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.95, side: THREE.DoubleSide,
        depthWrite: false, blending: THREE.AdditiveBlending
      });
      const m = new THREE.Mesh(ringGeo, mat);
      m.position.copy(pos);
      m.quaternion.copy(quat);
      m.scale.setScalar(0.2);
      world.add(m);
      ringFX.push({
        mesh: m, life: 0,
        dur: 0.6 + Math.random() * 0.5,
        spin: (Math.random() - 0.5) * 2.8,
        maxScale: 3.5 + Math.random() * 1.5
      });
    }

    /* ══ TIMING / CAMERA ══ */
    const TOTAL = 29;

    const CAM_KEYS = [
      { t: 0, p: [0, 0, 22], l: [0, 0, 0] },
      { t: 4, p: [0, 0, 15], l: [0, 0, 0] },
      { t: 9, p: [0, 1, 11], l: [0, 0, 0] },
      { t: 13, p: [0, 0, 17], l: [0, -0.3, 0] },
      { t: 17, p: [0, 0, 16], l: [0, -0.5, 0] },
      { t: 21, p: [0, 0, 14.5], l: [0, -0.6, 0] },
      { t: 25, p: [0, 0, 13.5], l: [0, -0.7, 0] },
      { t: 29, p: [0, 0, 13], l: [0, -0.8, 0] }
    ];

    const _camP = new THREE.Vector3();
    const _camL = new THREE.Vector3();

    function cameraAt(t) {
      let i = 0;
      while (i < CAM_KEYS.length - 1 && t > CAM_KEYS[i + 1].t) i++;
      const a = CAM_KEYS[i];
      const b = CAM_KEYS[Math.min(i + 1, CAM_KEYS.length - 1)];
      const span = Math.max(0.001, b.t - a.t);
      const k = smoothstep(0, 1, clamp((t - a.t) / span, 0, 1));
      _camP.set(a.p[0] + (b.p[0] - a.p[0]) * k, a.p[1] + (b.p[1] - a.p[1]) * k, a.p[2] + (b.p[2] - a.p[2]) * k);
      _camL.set(a.l[0] + (b.l[0] - a.l[0]) * k, a.l[1] + (b.l[1] - a.l[1]) * k, a.l[2] + (b.l[2] - a.l[2]) * k);
    }

    /* ══ AUDIO SCHEDULE ══ */
    const AUDIO_EVENTS = [
      { at: 4.5, type: 'whoosh', intensity: 0.14 },
      { at: 5.3, type: 'whoosh', intensity: 0.16 },
      { at: 6.1, type: 'whoosh', intensity: 0.18 },
      { at: 7.0, type: 'whoosh', intensity: 0.20 },
      { at: 8.0, type: 'whoosh', intensity: 0.22 },
      { at: 9.0, type: 'blip', intensity: 0.20, freq: 600 },
      { at: 9.35, type: 'blip', intensity: 0.20, freq: 700 },
      { at: 9.7, type: 'blip', intensity: 0.20, freq: 800 },
      { at: 10.05, type: 'blip', intensity: 0.20, freq: 900 },
      { at: 10.4, type: 'blip', intensity: 0.20, freq: 1000 },
      { at: 11.2, type: 'boom', intensity: 0.30 },
      { at: 13.2, type: 'boom', intensity: 0.42 },
      { at: 14.2, type: 'blip', intensity: 0.15, freq: 1000 },
      { at: 14.2, type: 'blip', intensity: 0.15, freq: 1200 },
      { at: 14.9, type: 'blip', intensity: 0.15, freq: 1000 },
      { at: 14.9, type: 'blip', intensity: 0.15, freq: 1200 },
      { at: 15.6, type: 'blip', intensity: 0.15, freq: 1000 },
      { at: 15.6, type: 'blip', intensity: 0.15, freq: 1200 },
      { at: 16.3, type: 'blip', intensity: 0.18, freq: 1000 },
      { at: 16.3, type: 'blip', intensity: 0.18, freq: 1400 },
      { at: 17.5, type: 'boom', intensity: 0.48 },
      { at: 19.0, type: 'drone', intensity: 0.07, duration: 7.5 },
      { at: 19.5, type: 'glitch', intensity: 0.22 },
      { at: 20.5, type: 'glitch', intensity: 0.25 },
      { at: 21.5, type: 'glitch', intensity: 0.28 },
      { at: 22.5, type: 'glitch', intensity: 0.31 },
      { at: 23.5, type: 'glitch', intensity: 0.34 },
      { at: 24.5, type: 'glitch', intensity: 0.37 },
      { at: 25.5, type: 'glitch', intensity: 0.40 },
      { at: 26.2, type: 'boom', intensity: 0.58 },
      { at: 27.8, type: 'boom', intensity: 0.38 }
    ];
    const firedAudioEvents = new Set();

    /* ══ STATE ══ */
    let elapsed = 0;
    let playing = true;
    let corePulseVal = 0;
    let collected = 0;
    let particleAcc = 0;
    const _tmpV = new THREE.Vector3();

    /* ══ UPDATE ══ */
    function update(t, dt) {
      cameraAt(t);
      const shake = 0.08;
      camera.position.set(
        _camP.x + Math.sin(t * 0.45) * shake,
        _camP.y + Math.sin(t * 0.61 + 1.3) * shake * 0.8,
        _camP.z + Math.cos(t * 0.33) * shake * 0.6
      );
      camera.lookAt(_camL.x, _camL.y, _camL.z);

      AUDIO_EVENTS.forEach((e, idx) => {
        if (t >= e.at && !firedAudioEvents.has(idx)) {
          firedAudioEvents.add(idx);
          triggerAudio(e.type, e);
        }
      });

      const dust = world.getObjectByName('dust');
      if (dust) {
        dust.rotation.y = t * 0.03 + Math.sin(t * 0.1) * 0.2;
        dust.rotation.x = Math.sin(t * 0.07) * 0.06;
      }

      const darkK = smoothstep(19, 26, t);
      const bg = new THREE.Color(0x0a0614).lerp(new THREE.Color(0x1a0308), darkK);
      scene.background = bg;
      vignetteMat.uniforms.uTint.value.setRGB(darkK * 0.15, 0, 0);
      vignetteMat.uniforms.uIntensity.value = 0.92 + darkK * 0.05;

      /* ═══ Fragmentos + convergencia ═══ */
      const convergeK = smoothstep(4, 8.5, t);
      fragments.forEach(f => {
        const appearK = smoothstep(f.startDelay, f.startDelay + 1.0, t);
        const drift = Math.sin(t * f.driftFreq + f.driftPhase) * f.driftAmp;
        const driftY = Math.cos(t * f.driftFreq * 0.8 + f.driftPhase) * f.driftAmp;
        const targetPos = _tmpV.set(0, 0, 0);
        const currentPos = f.basePos.clone().lerp(targetPos, convergeK);
        currentPos.x += drift * (1 - convergeK);
        currentPos.y += driftY * (1 - convergeK);
        f.sprite.position.copy(currentPos);
        const s = (1 - convergeK * 0.85) * appearK;
        f.sprite.scale.set(2.4 * s, 0.75 * s, 1);
        f.sprite.material.opacity = appearK * (1 - convergeK) * 0.85;
        f.sprite.material.rotation = Math.sin(t * 0.3 + f.driftPhase) * 0.05 * f.spinDir;
      });

      /* ═══ CORE — se disuelve más rápido para no tapar el centro ═══ */
      const coreScale = (0.001 + easeOutCubic(clamp((t - 4) / 4.5, 0, 1)) * 0.999);
      const coreFade = 1 - smoothstep(12.5, 16, t);       // ← fade-out temprano
      const coreFadeStrong = coreFade * coreFade;          // ← para el inner

      corePulseVal *= Math.exp(-5.0 * dt);
      const pulse = 1 + corePulseVal * 0.35;
      core.scale.setScalar(coreScale * pulse);
      core.visible = coreScale > 0.005 && coreFade > 0.005;

      const revealK = smoothstep(4.5, 9, t);
      coreWireMat.uniforms.uReveal.value = revealK;
      const wireOp = smoothstep(4.5, 6.0, t) * 0.75 * coreFade;
      const wireBreath = 0.9 + 0.1 * Math.sin(t * 1.6);
      coreWireMat.uniforms.uOpacity.value = wireOp * wireBreath;

      const innerK = smoothstep(6.5, 9.5, t);
      coreInnerMat.opacity = innerK * 0.95 * coreFadeStrong;

      const dotsK = smoothstep(8.5, 11, t);
      surfaceDotsMat.opacity = dotsK * 0.9 * coreFade;
      surfaceDots.rotation.y += dt * 0.15;

      coreRings.forEach((r, i) => {
        const d = 9 + i * 0.35;
        const rt = clamp((t - d) / 0.9, 0, 1);
        const e = easeOutCubic(rt);
        r.mat.opacity = e * 0.4 * coreFade;
        r.mesh.scale.setScalar(0.001 + e * 0.999);
      });

      coreGlowMat.opacity =
        (smoothstep(5, 8, t) * 0.35 + corePulseVal * 0.5) * coreFade;
      coreGlowMat.color.setHex(0xa855f7).lerp(new THREE.Color(0xc9184a), darkK);

      const entranceSpin = (1 - easeOutCubic(clamp((t - 4) / 4.5, 0, 1))) * Math.PI * 1.5;
      coreWire.rotation.y = t * 0.35 + entranceSpin;
      coreWire.rotation.x = Math.sin(t * 0.4) * 0.22;
      coreWire.rotation.z = Math.sin(t * 0.18) * 0.08;
      coreInner.rotation.y -= dt * 0.18;
      coreInner.rotation.z += dt * 0.06;

      coreRings.forEach(r => {
        if (r.axis === 'z') r.mesh.rotation.z += dt * r.speed;
        else r.mesh.rotation.x += dt * r.speed;
        r.mesh.rotation.y += Math.sin(t * 0.4 + r.speed) * 0.003;
      });

      /* ═══ Split — orbes simétricos ═══ */
      const splitK = smoothstep(12.5, 17, t);
      const benignAppear = splitK;
      const maliciousAppear = smoothstep(13, 17.5, t);

      const benignShrink = smoothstep(19, 25, t);
      const malGrow = smoothstep(19, 24, t);

      // ← NUEVO: migración al centro en la fase oscura
      const centerK = smoothstep(20, 26, t);

      // Orbe benigno: sale hacia -ORB_X y se desvanece (queda ahí)
      const benX = -ORB_X * benignAppear;
      benignOrb.position.set(benX, ORB_Y, 0);

      // Orbe malicioso: sale hacia +ORB_X y LUEGO vuelve al centro
      const malX = ORB_X * maliciousAppear * (1 - centerK);
      const malY = ORB_Y + centerK * 0.4;  // sube ligeramente al centrarse
      maliciousOrb.position.set(malX, malY, 0);

      benignOrb.scale.setScalar(benignAppear * (1 - benignShrink * 0.95));
      maliciousOrb.scale.setScalar(maliciousAppear * (1 + malGrow * 0.55));

      const bWireOp = benignAppear * (1 - benignShrink) * 0.85;
      const mWireOp = maliciousAppear * (0.85 + malGrow * 0.15);
      benignOrb.userData.wireMat.opacity = bWireOp;
      maliciousOrb.userData.wireMat.opacity = mWireOp;
      benignOrb.userData.glowMat.opacity = benignAppear * (1 - benignShrink) * (0.65 + 0.3 * Math.sin(t * 7));
      maliciousOrb.userData.glowMat.opacity = maliciousAppear * (0.7 + 0.35 * Math.sin(t * 6 + 1));

      benignOrb.userData.wire.rotation.y += dt * 1.2;
      benignOrb.userData.wire.rotation.x += dt * 0.8;
      maliciousOrb.userData.wire.rotation.y -= dt * 1.6;
      maliciousOrb.userData.wire.rotation.x += dt * 1.0;

      /* ── Labels benign (izquierda, se van) ── */
      benignLabels.forEach(l => {
        const o = smoothstep(l.t, l.t + 0.6, t) * (1 - smoothstep(20, 23, t));
        l.sp.material.opacity = o;
        l.sp.position.x = -LABEL_X - benignShrink * 3.0;
        l.sp.position.y = l.baseY + Math.sin(t * 1.2 + l.idx) * 0.05;
        l.sp.visible = o > 0.01;
      });

      /* ── Labels malicious (migran al CENTRO) ── */
      maliciousLabels.forEach(l => {
        const o = smoothstep(l.t, l.t + 0.6, t);
        l.sp.material.opacity = o;
        // ← x migra de +LABEL_X → 0 conforme centerK sube
        l.sp.position.x = LABEL_X * (1 - centerK);
        l.sp.position.y = l.baseY + Math.sin(t * 1.2 + l.idx) * 0.05;
        l.sp.visible = o > 0.01;
      });

      /* ═══ Partículas ═══ */
      if (t > 4 && t < 9.5) {
        particleAcc += dt * (80 + smoothstep(5, 8, t) * 100);
        let guard = 0;
        while (particleAcc >= 1 && guard < 50) {
          particleAcc -= 1; guard++;
          _v1.randomDirection().multiplyScalar(5 + Math.random() * 5);
          const src = _v1.clone();
          spawnParticle(src, new THREE.Vector3(0, 0, 0),
            BENIGN_PALETTE[Math.floor(Math.random() * BENIGN_PALETTE.length)]);
        }
      }

      if (t > 12.5 && t < 19) {
        particleAcc += dt * (100 + smoothstep(14, 17, t) * 130);
        let guard = 0;
        while (particleAcc >= 1 && guard < 60) {
          particleAcc -= 1; guard++;
          const toBenign = Math.random() > 0.5;
          const target = toBenign
            ? benignOrb.position.clone()
            : maliciousOrb.position.clone();
          _v1.randomDirection().multiplyScalar(0.5 + Math.random() * 1.5);
          const src = new THREE.Vector3(0, 0, 0).add(_v1);
          const palette = toBenign ? BENIGN_PALETTE : MALICIOUS_PALETTE;
          spawnParticle(src, target,
            palette[Math.floor(Math.random() * palette.length)]);
        }
      }

      if (t > 19 && t < 27) {
        particleAcc += dt * 140;
        let guard = 0;
        while (particleAcc >= 1 && guard < 60) {
          particleAcc -= 1; guard++;
          _v1.randomDirection().multiplyScalar(3 + Math.random() * 3);
          const src = _v1.clone();
          spawnParticle(src, maliciousOrb.position.clone(),
            MALICIOUS_PALETTE[Math.floor(Math.random() * MALICIOUS_PALETTE.length)]);
        }
      }

      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) { alphaArr[i] = 0; continue; }
        p.t += dt / p.dur;
        if (p.t >= 1) {
          p.active = false; alphaArr[i] = 0; collected++;
          corePulseVal = Math.min(1, corePulseVal + 0.025);
          continue;
        }
        const tt = p.t, mt = 1 - tt;
        let x = mt * mt * p.from.x + 2 * mt * tt * p.ctrl.x + tt * tt * p.to.x;
        let y = mt * mt * p.from.y + 2 * mt * tt * p.ctrl.y + tt * tt * p.to.y;
        let z = mt * mt * p.from.z + 2 * mt * tt * p.ctrl.z + tt * tt * p.to.z;
        const w = Math.sin(tt * p.wobbleFreq + p.wobblePhase) * p.wobble * Math.sin(tt * Math.PI);
        x += w * 0.6; y += w * 0.9;
        posArr[i * 3] = x;
        posArr[i * 3 + 1] = y;
        posArr[i * 3 + 2] = z;
        colArr[i * 3] = p.color.r;
        colArr[i * 3 + 1] = p.color.g;
        colArr[i * 3 + 2] = p.color.b;
        sizeArr[i] = p.size;
        alphaArr[i] = Math.min(1, tt * 6) * Math.min(1, (1 - tt) * 3.2) * 0.95;
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.aColor.needsUpdate = true;
      pGeo.attributes.aSize.needsUpdate = true;
      pGeo.attributes.aAlpha.needsUpdate = true;

      for (let i = ringFX.length - 1; i >= 0; i--) {
        const r = ringFX[i];
        r.life += dt / r.dur;
        if (r.life >= 1) {
          world.remove(r.mesh); r.mesh.material.dispose();
          ringFX.splice(i, 1); continue;
        }
        r.mesh.scale.setScalar(0.25 + r.life * r.maxScale);
        r.mesh.rotation.z += dt * r.spin;
        r.mesh.material.opacity = 0.9 * (1 - r.life) * (1 - r.life);
      }

      const closeFade = smoothstep(26.2, 27.5, t);
      closingLabel.material.opacity = closeFade;
      closingLabel.visible = closeFade > 0.01;
      closingLabel.position.y = -4.3 + centerK * 0.3 + Math.sin(t * 0.8) * 0.08;
    }

    /* ══ RECORDING ══ */
    const AUTO_RECORD = new URLSearchParams(location.search).get('record') === '1';
    const FPS = 60;
    const recBtn = document.getElementById('recBtn');
    const recLabel = document.getElementById('recLabel');
    const recStatus = document.getElementById('recStatus');

    function setStatus(txt) { recStatus.textContent = txt; recStatus.classList.add('show'); }
    function hideStatus() { recStatus.classList.remove('show'); }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function audioBufferToWav(buffer) {
      const numCh = buffer.numberOfChannels;
      const len = buffer.length;
      const sr = buffer.sampleRate;
      const bytesPerSample = 2;
      const blockAlign = numCh * bytesPerSample;
      const dataSize = len * blockAlign;
      const bufferSize = 44 + dataSize;
      const ab = new ArrayBuffer(bufferSize);
      const view = new DataView(ab);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);
      let offset = 44;
      const channels = [];
      for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
      for (let i = 0; i < len; i++) {
        for (let c = 0; c < numCh; c++) {
          let s = Math.max(-1, Math.min(1, channels[c][i]));
          s = s < 0 ? s * 0x8000 : s * 0x7FFF;
          view.setInt16(offset, s, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: 'audio/wav' });
    }

    async function renderAudioTrack() {
      const sr = 44100;
      const totalDur = TOTAL + 4.0;
      const ctx = new OfflineAudioContext(2, Math.ceil(totalDur * sr), sr);
      for (const ev of audioEvents) {
        scheduleAudioEvent(ctx, ev.type, ev.time, ev.params);
      }
      const rendered = await ctx.startRendering();
      return audioBufferToWav(rendered);
    }

    async function runRecording() {
      recBtn.disabled = true;
      recLabel.textContent = 'Recording';
      audioEnabled = false;
      IS_RECORDING = true;

      audioEvents.length = 0;
      elapsed = 0;
      corePulseVal = 0;
      collected = 0;
      particleAcc = 0;
      pCursor = 0;
      firedAudioEvents.clear();

      particles.forEach(p => { p.active = false; });
      for (let i = 0; i < PARTICLE_MAX; i++) alphaArr[i] = 0;
      ringFX.forEach(r => { world.remove(r.mesh); r.mesh.material.dispose(); });
      ringFX.length = 0;

      await new Promise(r => setTimeout(r, 200));

      if (typeof CCapture === 'undefined') {
        setStatus('ERROR: CCapture no cargó');
        recBtn.disabled = false; IS_RECORDING = false;
        return;
      }
      setStatus('Iniciando grabador...');

      const capturer = new CCapture({
        format: 'webm', framerate: FPS, quality: 100,
        name: 'doxing-darker-side', verbose: false
      });

      capturer.start();
      const totalFrames = Math.ceil((TOTAL + 1.5) * FPS);

      for (let frame = 0; frame <= totalFrames; frame++) {
        elapsed = Math.min(frame / FPS, TOTAL + 1.5);
        update(elapsed, 1 / FPS);
        renderer.render(scene, camera);
        capturer.capture(renderer.domElement);
        if (frame % 15 === 0) {
          setStatus(`Render ${frame}/${totalFrames} · ${Math.round((frame / totalFrames) * 100)}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }

      setStatus('Codificando video...');
      capturer.stop();
      capturer.save();
      await new Promise(r => setTimeout(r, 800));

      setStatus('Generando audio WAV...');
      try {
        const wavBlob = await renderAudioTrack();
        downloadBlob(wavBlob, 'doxing-darker-side.wav');
      } catch (e) { console.error('Audio render failed', e); }

      setStatus('✓ Listo · video + wav descargados');
      setTimeout(hideStatus, 4000);
      recBtn.disabled = false;
      recLabel.textContent = 'Record';
      audioEnabled = true;
      IS_RECORDING = false;
    }

    recBtn.addEventListener('click', () => { if (!recBtn.disabled) runRecording(); });
    if (AUTO_RECORD) setTimeout(runRecording, 800);

    /* ══ LOOP ══ */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (playing && !AUTO_RECORD && !IS_RECORDING) {
        elapsed += dt;
        if (elapsed > TOTAL + 1.5) elapsed = TOTAL + 1.5;
      }
      update(elapsed, dt);
      renderer.render(scene, camera);
    }

    /* ══ RESIZE ══ */
    function updateStageScale() {
      const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      document.documentElement.style.setProperty('--stage-scale', s);
    }
    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', () => setTimeout(updateStageScale, 120));
    updateStageScale();

    animate();
  </script>
</body>

</html>
