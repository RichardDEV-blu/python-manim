<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Doxing · 1080×1920</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #ede9fe;
    }

    :root {
      --stage-scale: 1;
    }

    /* Stage fijo 1080x1920, centrado y escalado */
    #stage {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center center;
      background: #0a0614;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(168, 85, 247, 0.15),
        0 0 120px rgba(168, 85, 247, 0.18);
      isolation: isolate;
    }

    #app {
      position: absolute;
      inset: 0;
    }

    #app canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #tag {
      position: absolute;
      left: 18px;
      top: 22px;
      z-index: 10;
      font-size: 10px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(196, 181, 253, 0.7);
      font-weight: 700;
      pointer-events: none;
      line-height: 1.5;
    }

    /* UI de grabación (fuera del stage, no se graba) */
    #recBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(30, 15, 55, 0.85);
      border: 1px solid rgba(255, 90, 90, 0.55);
      color: #ffb4b4;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .2s, box-shadow .2s;
    }

    #recBtn:hover {
      background: rgba(255, 90, 90, 0.2);
      box-shadow: 0 0 22px rgba(255, 90, 90, 0.4);
    }

    #recBtn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5a5a;
      box-shadow: 0 0 10px #ff5a5a;
    }

    #recBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #recStatus {
      position: fixed;
      top: 68px;
      right: 20px;
      z-index: 9999;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c4b5fd;
      background: rgba(10, 6, 20, 0.75);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(8px);
      display: none;
    }

    #recStatus.show {
      display: block;
    }
  </style>
</head>

<body>

  <div id="stage">
    <div id="app"></div>
  </div>

  <button id="recBtn"><span class="dot"></span><span id="recLabel">Record</span></button>
  <div id="recStatus"></div>

  <script src="https://cdn.jsdelivr.net/npm/ccapture.js@1.1.0/build/CCapture.all.min.js"></script>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    /* ══════════════════════════════════════════════════════════════
       FONT
       ══════════════════════════════════════════════════════════════ */
    await Promise.all([
      document.fonts.load('500 16px Montserrat'),
      document.fonts.load('600 16px Montserrat'),
      document.fonts.load('700 16px Montserrat'),
      document.fonts.load('800 16px Montserrat')
    ]);

    /* ══════════════════════════════════════════════════════════════
       UTILS
       ══════════════════════════════════════════════════════════════ */
    const clamp = THREE.MathUtils.clamp;
    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function roundRect(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
      g.closePath();
    }

    /* ══════════════════════════════════════════════════════════════
       AUDIO — Vórtice oscuro (Web Audio sintetizado)
       ══════════════════════════════════════════════════════════════ */
    let audioCtx = null;
    let audioEnabled = true;
    let IS_RECORDING = false;   // ← NUEVO: bandera global temprana
    const vortexEvents = []; // para render offline

    const _noiseBufs = new WeakMap();
    function getNoiseBuffer(ctx) {
      if (_noiseBufs.has(ctx)) return _noiseBufs.get(ctx);
      const len = Math.ceil(ctx.sampleRate * 2);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      _noiseBufs.set(ctx, buf);
      return buf;
    }

    /* Construye el grafo del vórtice sobre cualquier AudioContext */
    function scheduleVortexOnCtx(ctx, startTime, duration, intensity) {
      const t0 = Math.max(0, startTime);
      const noiseBuf = getNoiseBuffer(ctx);

      // Ruido base
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;

      // Lowpass que abre-agudo y cierra-grave
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.Q.value = 10;
      lp.frequency.setValueAtTime(4200, t0);
      lp.frequency.exponentialRampToValueAtTime(140, t0 + duration);

      // Bandpass resonante para el "whip" del vórtice
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = 2.5;
      bp.frequency.setValueAtTime(800, t0);
      bp.frequency.exponentialRampToValueAtTime(110, t0 + duration);

      // Gain maestro con envelope
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(intensity, t0 + 0.08);
      gain.gain.setValueAtTime(intensity, t0 + duration * 0.45);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

      // Sub rumble grave
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(190, t0);
      sub.frequency.exponentialRampToValueAtTime(42, t0 + duration);

      const subGain = ctx.createGain();
      subGain.gain.setValueAtTime(0.0001, t0);
      subGain.gain.linearRampToValueAtTime(intensity * 0.55, t0 + 0.1);
      subGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

      // Rutas
      noise.connect(lp).connect(gain);
      noise.connect(bp).connect(gain);
      gain.connect(ctx.destination);
      sub.connect(subGain).connect(ctx.destination);

      noise.start(t0);
      noise.stop(t0 + duration + 0.05);
      sub.start(t0);
      sub.stop(t0 + duration + 0.05);
    }

    function triggerVortex(intensity = 0.4, duration = 0.9) {
      vortexEvents.push({ time: elapsed, duration, intensity });
      if (audioCtx && audioEnabled && !IS_RECORDING) {
        scheduleVortexOnCtx(audioCtx, audioCtx.currentTime + 0.01, duration, intensity);
      }
    }

    function initAudio() {
      if (audioCtx) return;
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { console.warn('Audio not available', e); }
    }
    document.addEventListener('pointerdown', initAudio, { once: true });
    document.addEventListener('keydown', initAudio, { once: true });

    /* ══════════════════════════════════════════════════════════════
       RENDERER — fijo 1080x1920
       ══════════════════════════════════════════════════════════════ */
    const stageEl = document.getElementById('stage');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false,
      stencil: false,
      depth: true,
      preserveDrawingBuffer: true   // necesario para CCapture
    });
    renderer.setPixelRatio(1);              // 1:1, canvas = 1080x1920 exactos
    renderer.setSize(1080, 1920, false);    // false = no tocar CSS (lo controla #app)
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    if ('samples' in renderer) renderer.samples = 4;  // MSAA
    document.getElementById('app').appendChild(renderer.domElement);

    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

    /* ══════════════════════════════════════════════════════════════
       TEXTURAS
       ══════════════════════════════════════════════════════════════ */
    const circleTex = (() => {
      const s = 256, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();

    const glowTex = (() => {
      const s = 1024, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grd.addColorStop(0.0, 'rgba(255,255,255,0.98)');
      grd.addColorStop(0.14, 'rgba(255,255,255,0.55)');
      grd.addColorStop(0.4, 'rgba(255,255,255,0.18)');
      grd.addColorStop(0.7, 'rgba(255,255,255,0.04)');
      grd.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = grd; g.fillRect(0, 0, s, s);
      const t = new THREE.CanvasTexture(c); t.anisotropy = MAX_ANISO; t.needsUpdate = true;
      return t;
    })();

    function makeSiteCanvas(seed) {
      const SS = 3, L_W = 256, L_H = 320;
      const c = document.createElement('canvas');
      c.width = L_W * SS; c.height = L_H * SS;
      const g = c.getContext('2d');
      g.scale(SS, SS);
      const rnd = mulberry32(seed);
      const W = L_W, H = L_H;
      g.fillStyle = '#0d0818'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#1a1028'; g.fillRect(0, 0, W, 28);
      ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => {
        g.fillStyle = col;
        g.beginPath(); g.arc(16 + i * 15, 14, 4.5, 0, Math.PI * 2); g.fill();
      });
      g.fillStyle = '#2a1b44'; roundRect(g, 62, 7, W - 76, 14, 7); g.fill();
      g.fillStyle = '#1c1035'; g.fillRect(0, 28, W, 56);
      g.fillStyle = '#3b1f6b'; g.beginPath(); g.arc(38, 56, 18, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#6b3fa8'; g.beginPath(); g.arc(38, 50, 7, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(38, 74, 12, Math.PI, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(196,181,253,0.55)'; g.fillRect(66, 44, 92, 9);
      g.fillStyle = 'rgba(139,92,246,0.5)'; g.fillRect(66, 62, 62, 7);
      let y = 100;
      for (let i = 0; i < 7; i++) {
        const w = 55 + rnd() * 150;
        g.fillStyle = `rgba(168,140,240,${0.14 + rnd() * 0.24})`;
        g.fillRect(16, y, w, 7);
        y += 15; if (rnd() > 0.7) y += 7;
      }
      const gy = 218;
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {
        const bx = 16 + i * 78, by = gy + j * 46;
        g.fillStyle = `rgba(${60 + rnd() * 70 | 0},${30 + rnd() * 70 | 0},${140 + rnd() * 90 | 0},0.6)`;
        roundRect(g, bx, by, 68, 38, 4); g.fill();
        g.strokeStyle = 'rgba(196,181,253,0.28)'; g.lineWidth = 1; g.stroke();
      }
      return c;
    }

    function makeTileCanvas(seed) {
      const SS = 4, L_S = 64;
      const c = document.createElement('canvas');
      c.width = c.height = L_S * SS;
      const g = c.getContext('2d');
      g.scale(SS, SS);
      const rnd = mulberry32(seed);
      const S = L_S;
      g.fillStyle = '#120a22'; g.fillRect(0, 0, S, S);
      g.fillStyle = 'rgba(168,85,247,0.6)'; g.fillRect(0, 0, S, 9);
      for (let i = 0; i < 5; i++) {
        g.fillStyle = `rgba(196,181,253,${0.15 + rnd() * 0.28})`;
        g.fillRect(6, 16 + i * 9, 16 + rnd() * 36, 5);
      }
      g.strokeStyle = 'rgba(232,121,249,0.5)'; g.lineWidth = 2;
      g.strokeRect(1, 1, S - 2, S - 2);
      return c;
    }

    function makeLabel(text, opts = {}) {
      const color = opts.color || '#c4b5fd';
      const bg = opts.bg || 'rgba(15,8,32,0.85)';
      const fontSize = opts.fontSize || 52;
      const SS = 3;
      const mc = document.createElement('canvas');
      const mg = mc.getContext('2d');
      const font = `700 ${fontSize}px "Montserrat", "Segoe UI", system-ui, sans-serif`;
      mg.font = font;
      const pad = 30;
      const w = Math.ceil(mg.measureText(text).width) + pad * 2;
      const h = fontSize + pad * 1.1;
      const c = document.createElement('canvas');
      c.width = w * SS; c.height = h * SS;
      const g = c.getContext('2d');
      g.scale(SS, SS);
      g.font = font;
      roundRect(g, 2, 2, w - 4, h - 4, 16);
      g.fillStyle = bg; g.fill();
      g.strokeStyle = color; g.globalAlpha = 0.45; g.lineWidth = 2.5; g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = color; g.shadowBlur = 18;
      g.fillText(text, w / 2, h / 2 + 2);
      const tex = new THREE.CanvasTexture(c); tex.anisotropy = MAX_ANISO; tex.needsUpdate = true;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, opacity: 0 });
      const sp = new THREE.Sprite(mat);
      const k = 0.0105;
      sp.scale.set(w * k, h * k, 1);
      sp.renderOrder = 20;
      return sp;
    }

    /* ══════════════════════════════════════════════════════════════
       SCENE
       ══════════════════════════════════════════════════════════════ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0614);

    // Cámara con aspecto FIJO 1080/1920
    const camera = new THREE.PerspectiveCamera(52, 1080 / 1920, 0.1, 400);
    camera.position.set(0, 2.5, 30);

    const world = new THREE.Group();
    scene.add(world);

    /* Vignette baking (post-process simple, se incluye en la grabación) */
    const vignetteMat = new THREE.ShaderMaterial({
      uniforms: { uIntensity: { value: 0.92 } },
      vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
      fragmentShader: `
    uniform float uIntensity;
    varying vec2 vUv;
    void main() {
      vec2 uv = vUv - 0.5;
      uv.x *= 1.08;
      float d = length(uv);
      float v = smoothstep(0.42, 0.92, d) * uIntensity;
      gl_FragColor = vec4(0.0, 0.0, 0.0, v);
    }
  `,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    });
    const vignetteQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vignetteMat);
    vignetteQuad.frustumCulled = false;
    vignetteQuad.renderOrder = 9999;
    scene.add(vignetteQuad);

    /* ── Dust ── */
    const DUST_N = 8000;
    {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(DUST_N * 3);
      for (let i = 0; i < DUST_N; i++) {
        const r = 10 + Math.random() * 30;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.cos(ph) * 0.9;
        pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.22, map: circleTex, color: 0x7c3aed, transparent: true,
        opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      });
      const dust = new THREE.Points(geo, mat);
      dust.name = 'dust';
      world.add(dust);
    }

    /* ── Core ── */
    const core = new THREE.Group();
    core.scale.setScalar(0.001);
    world.add(core);

    const coreInnerMat = new THREE.MeshBasicMaterial({ color: 0x2e1065, transparent: true, opacity: 0 });
    const coreInner = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 4), coreInnerMat);
    core.add(coreInner);

    const coreWireMat = new THREE.ShaderMaterial({
      uniforms: {
        uReveal: { value: 0 },
        uOpacity: { value: 0 },
        uColor: { value: new THREE.Color(0x8b5cf6) },
        uRim: { value: new THREE.Color(0xe879f9) }
      },
      vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
      fragmentShader: `
    uniform float uReveal;
    uniform float uOpacity;
    uniform vec3  uColor;
    uniform vec3  uRim;
    varying vec3  vPos;
    void main() {
      float yNorm = clamp(vPos.y / 1.35, -1.0, 1.0);
      float threshold = -1.2 + uReveal * 2.4;
      float reveal = smoothstep(threshold + 0.10, threshold - 0.10, yNorm);
      float distToFront = abs(yNorm - threshold);
      float rim = exp(-distToFront * distToFront * 22.0);
      float revealActive = smoothstep(0.0, 0.08, uReveal) * (1.0 - smoothstep(0.92, 1.0, uReveal));
      float a = max(reveal * 0.85, rim * revealActive) * uOpacity;
      if (a < 0.008) discard;
      vec3 col = uColor + rim * revealActive * uRim * 1.4;
      gl_FragColor = vec4(col, a);
    }
  `,
      wireframe: true, transparent: true, depthWrite: false, blending: THREE.NormalBlending
    });
    const coreWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.35, 3), coreWireMat);
    core.add(coreWire);

    const coreRings = [];
    const ringParams = [
      { rx: 1.85, tilt: [Math.PI / 2, 0, 0], speed: 0.42, axis: 'z' },
      { rx: 2.35, tilt: [Math.PI / 2 + 0.55, 0.8, 0], speed: -0.28, axis: 'z' },
      { rx: 2.85, tilt: [Math.PI / 2 + 1.1, 1.6, 0.3], speed: 0.18, axis: 'x' }
    ];
    ringParams.forEach(rp => {
      const rMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0 });
      const r = new THREE.Mesh(new THREE.TorusGeometry(rp.rx, 0.012, 12, 256), rMat);
      r.rotation.set(rp.tilt[0], rp.tilt[1], rp.tilt[2]);
      core.add(r);
      coreRings.push({ mesh: r, mat: rMat, speed: rp.speed, axis: rp.axis });
    });

    const coreGlowMat = new THREE.SpriteMaterial({
      map: glowTex, color: 0xa855f7, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const coreGlow = new THREE.Sprite(coreGlowMat);
    coreGlow.scale.set(10, 10, 1);
    core.add(coreGlow);

    const CORE_START = 1.5, CORE_SCALE_DUR = 2.2, CORE_REVEAL_DUR = 2.8;
    const CORE_INNER_DELAY = 0.5, CORE_INNER_DUR = 1.8;
    const CORE_RING_DELAY = 1.0, CORE_RING_DUR = 1.4, CORE_RING_STAGGER = 0.30;

    /* ── Panels ── */
    const panelGroup = new THREE.Group();
    world.add(panelGroup);

    const PANEL_POSITIONS = [
      { x: 0.0, y: 6.4, z: 1.4 }, { x: 4.6, y: 3.0, z: -1.0 },
      { x: 4.4, y: -3.2, z: 1.0 }, { x: 0.0, y: -6.4, z: -1.4 },
      { x: -4.4, y: -3.2, z: 1.0 }, { x: -4.6, y: 3.0, z: -1.0 }
    ];

    const panels = [];
    PANEL_POSITIONS.forEach((p, i) => {
      const tex = new THREE.CanvasTexture(makeSiteCanvas(101 + i * 17));
      tex.anisotropy = MAX_ANISO; tex.needsUpdate = true;
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.5), mat);
      mesh.position.set(p.x, p.y, p.z);
      mesh.lookAt(0, p.y * 0.4, 0);
      panelGroup.add(mesh);
      const frameMat = new THREE.LineBasicMaterial({ color: 0xc4b5fd, transparent: true, opacity: 0 });
      const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.16, 2.66)), frameMat);
      frame.position.copy(mesh.position);
      frame.quaternion.copy(mesh.quaternion);
      panelGroup.add(frame);
      panels.push({
        mesh, mat, frameMat,
        basePos: mesh.position.clone(), pos: mesh.position.clone(), quat: mesh.quaternion.clone(),
        floatPhase: Math.random() * Math.PI * 2,
        floatAmpY: 0.28 + Math.random() * 0.22,
        floatAmpX: 0.12 + Math.random() * 0.10,
        floatFreq: 0.6 + Math.random() * 0.5,
        framePulsePhase: Math.random() * Math.PI * 2
      });
    });

    /* ── Orbs ── */
    function makeOrb(color) {
      const g = new THREE.Group();
      const matCore = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
      const matCage = new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.75 });
      const matGlow = new THREE.SpriteMaterial({
        map: glowTex, color, transparent: true, opacity: 0.85,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const inner = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), matCore);
      const cage = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 1), matCage);
      const glow = new THREE.Sprite(matGlow);
      glow.scale.set(2.4, 2.4, 1);
      g.add(inner, cage, glow);
      g.userData = {
        mats: [matCore, matCage, matGlow], inner, cage, glow,
        innerSpinX: 1.0 + Math.random() * 1.4, innerSpinY: 1.4 + Math.random() * 1.8,
        cageSpinX: 1.2 + Math.random() * 1.2, cageSpinY: 2.0 + Math.random() * 1.8,
        pulsePhase: Math.random() * Math.PI * 2
      };
      return g;
    }

    const mainOrb = makeOrb(0xc4b5fd);
    mainOrb.position.set(0, 0, 6);
    world.add(mainOrb);

    const swarm = new THREE.Group();
    swarm.visible = false;
    world.add(swarm);
    const swarmOrbs = [];
    const ORBIT_PATTERNS = ['ellipseV', 'ellipseH', 'tilted', 'ellipseV', 'tilted', 'ellipseH', 'tilted', 'ellipseV', 'ellipseH'];
    for (let i = 0; i < 9; i++) {
      const o = makeOrb(i % 3 === 0 ? 0xf0abfc : 0xc4b5fd);
      const a = (i / 9) * Math.PI * 2;
      o.userData.angle = a;
      o.userData.radiusX = 6 + Math.random() * 4.5;
      o.userData.radiusY = 7 + Math.random() * 4.5;
      o.userData.speed = 0.10 + Math.random() * 0.22;
      o.userData.yOff = (Math.random() - 0.5) * 3.5;
      o.userData.zAmp = 2.5 + Math.random() * 3;
      o.userData.zFreq = 0.5 + Math.random() * 0.7;
      o.userData.pattern = ORBIT_PATTERNS[i];
      o.userData.tilt = (Math.random() - 0.5) * 0.8;
      swarm.add(o);
      swarmOrbs.push(o);
    }

    /* ── Tiles ── */
    const TILE_N = 1500;
    const tileTex = new THREE.CanvasTexture(makeTileCanvas(7));
    tileTex.anisotropy = MAX_ANISO; tileTex.needsUpdate = true;
    const tileMat = new THREE.MeshBasicMaterial({ map: tileTex, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
    const tiles = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.0, 1.2), tileMat, TILE_N);
    {
      const dummy = new THREE.Object3D();
      for (let i = 0; i < TILE_N; i++) {
        const r = 11 + Math.pow(Math.random(), 0.7) * 20;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        dummy.position.set(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 1.05, r * Math.sin(ph) * Math.sin(th));
        dummy.lookAt(0, 0, 0);
        dummy.updateMatrix();
        tiles.setMatrixAt(i, dummy.matrix);
      }
      tiles.instanceMatrix.needsUpdate = true;
    }
    world.add(tiles);

    /* ── Particles ── */
    const PARTICLE_MAX = 10000;
    const pGeo = new THREE.BufferGeometry();
    const posArr = new Float32Array(PARTICLE_MAX * 3);
    const colArr = new Float32Array(PARTICLE_MAX * 3);
    const sizeArr = new Float32Array(PARTICLE_MAX);
    const alphaArr = new Float32Array(PARTICLE_MAX);

    pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    pGeo.setAttribute('aColor', new THREE.BufferAttribute(colArr, 3));
    pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizeArr, 1));
    pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(alphaArr, 1));

    const pMat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: 960 } },
      vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aAlpha;
    uniform float uScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = aColor; vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uScale / max(0.001, -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
      fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float a = smoothstep(0.5, 0.03, d);
      float al = a * vAlpha;
      if (al < 0.008) discard;
      gl_FragColor = vec4(vColor, al);
    }
  `,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const pPoints = new THREE.Points(pGeo, pMat);
    pPoints.frustumCulled = false;
    world.add(pPoints);

    const particles = [];
    for (let i = 0; i < PARTICLE_MAX; i++) {
      particles.push({
        active: false, t: 0, dur: 1, size: 0.25, alpha: 0,
        from: new THREE.Vector3(), to: new THREE.Vector3(),
        ctrl: new THREE.Vector3(), color: new THREE.Color(),
        wobble: 0, wobbleFreq: 0, wobblePhase: 0
      });
    }
    let pCursor = 0;
    const _v1 = new THREE.Vector3();
    const _white = new THREE.Color(0xffffff);
    const PARTICLE_PALETTE = [0xf0abfc, 0x8b5cf6, 0xc4b5fd, 0xe879f9, 0xa855f7, 0xd8b4fe];

    function spawnParticle(from, to, colorHex) {
      let slot = -1;
      for (let i = 0; i < 260; i++) {
        const idx = (pCursor + i) % PARTICLE_MAX;
        if (!particles[idx].active) { slot = idx; break; }
      }
      if (slot === -1) slot = pCursor;
      pCursor = (slot + 1) % PARTICLE_MAX;
      const p = particles[slot];
      p.active = true;
      p.from.copy(from);
      p.to.copy(to);
      _v1.randomDirection().multiplyScalar(1.2 + Math.random() * 3.4);
      p.ctrl.copy(from).add(to).multiplyScalar(0.5).add(_v1);
      p.t = 0;
      p.dur = 0.75 + Math.random() * 1.05;
      p.size = 0.14 + Math.random() * 0.38;
      p.color.setHex(colorHex).lerp(_white, Math.random() * 0.4);
      p.wobble = 0.15 + Math.random() * 0.45;
      p.wobbleFreq = 6 + Math.random() * 8;
      p.wobblePhase = Math.random() * Math.PI * 2;
    }

    function burst(from, count, colorHex, spread) {
      for (let i = 0; i < count; i++) {
        _v1.randomDirection().multiplyScalar(spread * Math.random());
        const src = from.clone().add(_v1);
        spawnParticle(src, new THREE.Vector3(0, 0, 0), colorHex);
      }
    }

    /* ── Rings ── */
    const ringGeo = new THREE.RingGeometry(0.86, 1.0, 256);
    const ringFX = [];
    function spawnRing(pos, quat, color) {
      const mat = new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: 0.95, side: THREE.DoubleSide,
        depthWrite: false, blending: THREE.AdditiveBlending
      });
      const m = new THREE.Mesh(ringGeo, mat);
      m.position.copy(pos);
      m.quaternion.copy(quat);
      m.scale.setScalar(0.2);
      world.add(m);
      ringFX.push({
        mesh: m, life: 0,
        dur: 0.75 + Math.random() * 0.6,
        spin: (Math.random() - 0.5) * 2.4,
        maxScale: 3.0 + Math.random() * 1.4
      });
    }

    /* ── Labels ── */
    const formatLabels = [
      {
        sp: makeLabel('{ } JSON', { color: '#f0abfc', fontSize: 60 }),
        pos: new THREE.Vector3(3.2, 3.0, 1.5), t: 35.4, floatAmp: 0.24, floatFreq: 1.1, floatPhase: 0.0
      },
      {
        sp: makeLabel('CSV', { color: '#c4b5fd', fontSize: 60 }),
        pos: new THREE.Vector3(-3.2, 0.4, 1.5), t: 36.8, floatAmp: 0.30, floatFreq: 0.85, floatPhase: 1.8
      },
      {
        sp: makeLabel('DATABASE', { color: '#a78bfa', fontSize: 60 }),
        pos: new THREE.Vector3(3.2, -2.4, 1.5), t: 38.2, floatAmp: 0.20, floatFreq: 1.35, floatPhase: 3.4
      }
    ];
    formatLabels.forEach(f => { f.sp.position.copy(f.pos); world.add(f.sp); });

    const CATEGORIES = [
      { text: 'NAMES', color: '#c4b5fd', t: 51.2, angle: 0.0, y: 2.2, radius: 4.3, speed: 0.14, bobAmp: 0.42, bobFreq: 0.9 },
      { text: 'JOBS', color: '#f0abfc', t: 52.6, angle: 1.6, y: -1.0, radius: 4.9, speed: -0.11, bobAmp: 0.55, bobFreq: 1.15 },
      { text: 'PHOTOS', color: '#e879f9', t: 54.0, angle: 3.2, y: 2.6, radius: 4.1, speed: 0.09, bobAmp: 0.36, bobFreq: 0.75 },
      { text: 'LOCATIONS', color: '#a78bfa', t: 55.4, angle: 4.7, y: -2.0, radius: 4.7, speed: -0.16, bobAmp: 0.48, bobFreq: 1.05 }
    ];
    const catLabels = CATEGORIES.map(c => {
      const sp = makeLabel(c.text, { color: c.color, fontSize: 54 });
      world.add(sp);
      return { ...c, sp };
    });

    /* ══════════════════════════════════════════════════════════════
       TIMING / CAMERA
       ══════════════════════════════════════════════════════════════ */
    const TOTAL = 72;

    const CAM_KEYS = [
      { t: 0, p: [0, 2.5, 30], l: [0, 0.5, 0] },
      { t: 12, p: [0, 3.0, 26], l: [0, 0.5, 0] },
      { t: 20, p: [2.5, 4.5, 20], l: [0, 0.4, 0] },
      { t: 30, p: [-2.5, 3.5, 20], l: [0, 0.4, 0] },
      { t: 38, p: [0, 5.5, 24], l: [0, 0.0, 0] },
      { t: 45, p: [0, 8.0, 48], l: [0, 0.0, 0] },
      { t: 51, p: [0, 3.5, 19], l: [0, 0.3, 0] },
      { t: 59, p: [2.2, 2.5, 19], l: [0, 0.3, 0] },
      { t: 66, p: [-2.2, 2.0, 19], l: [0, 0.3, 0] },
      { t: 72, p: [0, 1.5, 21], l: [0, 0.3, 0] }
    ];

    const _camP = new THREE.Vector3();
    const _camL = new THREE.Vector3();

    function cameraAt(t) {
      let i = 0;
      while (i < CAM_KEYS.length - 1 && t > CAM_KEYS[i + 1].t) i++;
      const a = CAM_KEYS[i];
      const b = CAM_KEYS[Math.min(i + 1, CAM_KEYS.length - 1)];
      const span = Math.max(0.001, b.t - a.t);
      const k = smoothstep(0, 1, clamp((t - a.t) / span, 0, 1));
      _camP.set(
        a.p[0] + (b.p[0] - a.p[0]) * k,
        a.p[1] + (b.p[1] - a.p[1]) * k,
        a.p[2] + (b.p[2] - a.p[2]) * k
      );
      _camL.set(
        a.l[0] + (b.l[0] - a.l[0]) * k,
        a.l[1] + (b.l[1] - a.l[1]) * k,
        a.l[2] + (b.l[2] - a.l[2]) * k
      );
    }

    /* ══════════════════════════════════════════════════════════════
       STATE
       ══════════════════════════════════════════════════════════════ */
    let elapsed = 0;
    let playing = true;
    let nextScrape = 16.6;
    let corePulseVal = 0;
    let corePulseSlow = 0;
    let collected = 0;
    let scaleSpawnAcc = 0;
    const pending = [];
    const orbTarget = new THREE.Vector3(0, 0, 6);
    const _tmpM = new THREE.Matrix4();
    const _tmpV = new THREE.Vector3();

    function later(delay, fn) { pending.push({ at: elapsed + delay, fn }); }

    function doScrape() {
      const p = panels[Math.floor(Math.random() * panels.length)];
      orbTarget.copy(p.pos).multiplyScalar(0.68);
      const origin = p.pos.clone().multiplyScalar(0.92);
      spawnRing(p.pos, p.quat, 0xc4b5fd);
      later(0.5, () => burst(origin, 18, 0xc4b5fd, 0.45));
      // Vórtice oscuro cuando el módulo blanco viaja
      triggerVortex(0.38, 0.85 + Math.random() * 0.15);
    }

    /* ══════════════════════════════════════════════════════════════
       UPDATE
       ══════════════════════════════════════════════════════════════ */
    function setGroupOpacity(group, o) {
      group.traverse(obj => {
        if (obj.material && obj.material.transparent) obj.material.opacity = o;
      });
    }

    function update(t, dt) {
      cameraAt(t);
      const shake = 0.10;
      camera.position.set(
        _camP.x + Math.sin(t * 0.37) * shake,
        _camP.y + Math.sin(t * 0.53 + 1.3) * shake * 0.8,
        _camP.z + Math.cos(t * 0.29) * shake * 0.6
      );
      camera.lookAt(_camL.x, _camL.y, _camL.z);

      for (let i = pending.length - 1; i >= 0; i--) {
        if (t >= pending[i].at) {
          const fn = pending[i].fn;
          pending.splice(i, 1);
          fn();
        }
      }

      const dust = world.getObjectByName('dust');
      if (dust) {
        dust.rotation.y = t * 0.018 + Math.sin(t * 0.07) * 0.25;
        dust.rotation.x = Math.sin(t * 0.05) * 0.08;
        dust.rotation.z = Math.cos(t * 0.04) * 0.06;
      }

      // Core reveal
      const scaleT = clamp((t - CORE_START) / CORE_SCALE_DUR, 0, 1);
      const scaleEase = easeOutCubic(scaleT);
      const revealT = clamp((t - CORE_START) / CORE_REVEAL_DUR, 0, 1);
      coreWireMat.uniforms.uReveal.value = smoothstep(0, 1, revealT);
      const wireFade = smoothstep(CORE_START, CORE_START + 1.4, t);
      const wireBreath = 0.9 + 0.1 * Math.sin(t * 1.2);
      coreWireMat.uniforms.uOpacity.value = wireFade * 0.75 * wireBreath;
      const innerT = clamp((t - CORE_START - CORE_INNER_DELAY) / CORE_INNER_DUR, 0, 1);
      coreInnerMat.opacity = easeOutCubic(innerT) * 0.95;
      coreRings.forEach((r, i) => {
        const d = CORE_START + CORE_RING_DELAY + i * CORE_RING_STAGGER;
        const rt = clamp((t - d) / CORE_RING_DUR, 0, 1);
        const e = easeOutCubic(rt);
        r.mat.opacity = e * 0.35;
        r.mesh.scale.setScalar(0.001 + e * 0.999);
      });
      const glowT = smoothstep(CORE_START, CORE_START + 1.8, t);
      coreGlowMat.opacity = glowT * 0.35 + corePulseVal * 0.5;

      corePulseVal *= Math.exp(-4.2 * dt);
      corePulseSlow = 0.5 + 0.5 * Math.sin(t * 1.4);
      const breath = 1 + Math.sin(t * 0.9) * 0.012;
      const coreScale =
        (0.001 + scaleEase * 0.999) *
        (1 + Math.min(1.0, collected * 0.0009)) *
        (1 + corePulseVal * 0.35) *
        (1 + corePulseSlow * 0.05) * breath;
      core.scale.setScalar(coreScale);
      core.visible = coreScale > 0.005;

      const entranceSpin = (1 - scaleEase) * Math.PI * 1.5;
      coreWire.rotation.y = t * 0.22 + entranceSpin;
      coreWire.rotation.x = Math.sin(t * 0.30) * 0.20 + (1 - scaleEase) * 0.55;
      coreWire.rotation.z = Math.sin(t * 0.15) * 0.06;
      coreInner.rotation.y -= dt * 0.14;
      coreInner.rotation.z += dt * 0.05;
      coreRings.forEach(r => {
        if (r.axis === 'z') r.mesh.rotation.z += dt * r.speed;
        else r.mesh.rotation.x += dt * r.speed;
        r.mesh.rotation.y += Math.sin(t * 0.3 + r.speed) * 0.002;
      });

      // Panels
      const panelOpacity = smoothstep(13, 18, t) * (1 - smoothstep(42, 48, t));
      panels.forEach((p, i) => {
        const fy = Math.sin(t * p.floatFreq + p.floatPhase) * p.floatAmpY;
        const fx = Math.cos(t * p.floatFreq * 0.7 + p.floatPhase) * p.floatAmpX;
        p.mesh.position.x = p.basePos.x + fx;
        p.mesh.position.y = p.basePos.y + fy;
        p.pos.copy(p.mesh.position);
        p.mat.opacity = panelOpacity * (0.85 + 0.15 * Math.sin(t * 1.6 + p.framePulsePhase));
        p.frameMat.opacity = panelOpacity * 0.5 * (0.55 + 0.45 * Math.sin(t * 2 + p.framePulsePhase));
        p.mesh.lookAt(0, p.mesh.position.y * 0.4, 0);
        const frame = panelGroup.children[i * 2 + 1];
        if (frame) { frame.position.copy(p.mesh.position); frame.quaternion.copy(p.mesh.quaternion); }
      });

      // Main scraper
      const orbVisible = smoothstep(15, 17, t) * (1 - smoothstep(42, 47, t));
      mainOrb.visible = orbVisible > 0.01;
      setGroupOpacity(mainOrb, orbVisible);
      if (orbVisible > 0.01) {
        const k = 1 - Math.exp(-3.4 * dt);
        const zigX = Math.sin(t * 7.5) * 0.08;
        const zigY = Math.cos(t * 6.3) * 0.08;
        const target = _tmpV.set(orbTarget.x + zigX, orbTarget.y + zigY, orbTarget.z);
        mainOrb.position.lerp(target, k);
        mainOrb.userData.cage.rotation.y += dt * mainOrb.userData.cageSpinY;
        mainOrb.userData.cage.rotation.x += dt * mainOrb.userData.cageSpinX;
        mainOrb.userData.inner.rotation.y += dt * mainOrb.userData.innerSpinY;
        mainOrb.userData.inner.rotation.x += dt * mainOrb.userData.innerSpinX;
        mainOrb.userData.glow.material.opacity = orbVisible * (0.55 + 0.4 * Math.sin(t * 6 + mainOrb.userData.pulsePhase));
      }

      if (t > 16.6 && t < 40 && t >= nextScrape) {
        doScrape();
        nextScrape += 1.85 + Math.random() * 0.5;
      }

      // Rings
      for (let i = ringFX.length - 1; i >= 0; i--) {
        const r = ringFX[i];
        r.life += dt / r.dur;
        if (r.life >= 1) {
          world.remove(r.mesh); r.mesh.material.dispose();
          ringFX.splice(i, 1); continue;
        }
        r.mesh.scale.setScalar(0.25 + r.life * r.maxScale);
        r.mesh.rotation.z += dt * r.spin;
        r.mesh.material.opacity = 0.9 * (1 - r.life) * (1 - r.life);
      }

      // Tiles
      const tileOpacity = smoothstep(40, 46, t) * (1 - smoothstep(64, 71, t));
      tileMat.opacity = tileOpacity * 0.72;
      tiles.visible = tileOpacity > 0.005;
      if (tiles.visible) {
        tiles.rotation.y = t * 0.012;
        tiles.rotation.x = Math.sin(t * 0.15) * 0.05;
      }

      // Swarm
      const swarmOpacity = smoothstep(41, 47, t) * (1 - smoothstep(64, 70, t));
      swarm.visible = swarmOpacity > 0.01;
      if (swarm.visible) {
        swarmOrbs.forEach((o, i) => {
          o.userData.angle += dt * o.userData.speed;
          const a = o.userData.angle;
          const rx = o.userData.radiusX, ry = o.userData.radiusY;
          const zA = o.userData.zAmp, zF = o.userData.zFreq;
          let px, py, pz;
          switch (o.userData.pattern) {
            case 'ellipseV':
              px = Math.cos(a) * rx * 0.7; py = Math.sin(a) * ry; pz = Math.sin(a * zF) * zA * 0.5; break;
            case 'ellipseH':
              px = Math.cos(a) * rx; py = Math.sin(a) * ry * 0.55; pz = Math.cos(a * zF) * zA * 0.5; break;
            case 'tilted':
              px = Math.cos(a) * rx; py = Math.sin(a) * ry + Math.cos(a + o.userData.tilt) * 1.5; pz = Math.sin(a + o.userData.tilt) * zA; break;
          }
          o.position.set(px, py + o.userData.yOff, pz);
          o.userData.cage.rotation.y += dt * o.userData.cageSpinY;
          o.userData.cage.rotation.z += dt * o.userData.cageSpinX;
          o.userData.inner.rotation.y += dt * o.userData.innerSpinY;
          o.userData.glow.material.opacity = swarmOpacity * (0.5 + 0.4 * Math.sin(t * 5 + o.userData.pulsePhase));
          o.userData.mats[0].opacity = swarmOpacity;
          o.userData.mats[1].opacity = swarmOpacity * 0.75;
        });
      }

      // Massive data flow
      if (t > 41 && t < 63.5) {
        const rate = 60 + smoothstep(44, 52, t) * 130;
        scaleSpawnAcc += dt * rate;
        let guard = 0;
        while (scaleSpawnAcc >= 1 && guard < 60) {
          scaleSpawnAcc -= 1; guard++;
          const idx = Math.floor(Math.random() * TILE_N);
          tiles.getMatrixAt(idx, _tmpM);
          _tmpV.setFromMatrixPosition(_tmpM);
          spawnParticle(_tmpV, new THREE.Vector3(0, 0, 0),
            PARTICLE_PALETTE[Math.floor(Math.random() * PARTICLE_PALETTE.length)]);
        }
      }

      // Particles
      for (let i = 0; i < PARTICLE_MAX; i++) {
        const p = particles[i];
        if (!p.active) { alphaArr[i] = 0; continue; }
        p.t += dt / p.dur;
        if (p.t >= 1) {
          p.active = false; alphaArr[i] = 0; collected++;
          corePulseVal = Math.min(1, corePulseVal + 0.035);
          continue;
        }
        const tt = p.t, mt = 1 - tt;
        let x = mt * mt * p.from.x + 2 * mt * tt * p.ctrl.x + tt * tt * p.to.x;
        let y = mt * mt * p.from.y + 2 * mt * tt * p.ctrl.y + tt * tt * p.to.y;
        let z = mt * mt * p.from.z + 2 * mt * tt * p.ctrl.z + tt * tt * p.to.z;
        const w = Math.sin(tt * p.wobbleFreq + p.wobblePhase) * p.wobble * Math.sin(tt * Math.PI);
        x += w * 0.6; y += w * 0.9;
        posArr[i * 3] = x; posArr[i * 3 + 1] = y; posArr[i * 3 + 2] = z;
        colArr[i * 3] = p.color.r; colArr[i * 3 + 1] = p.color.g; colArr[i * 3 + 2] = p.color.b;
        sizeArr[i] = p.size;
        alphaArr[i] = Math.min(1, tt * 6) * Math.min(1, (1 - tt) * 3.2) * 0.95;
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.aColor.needsUpdate = true;
      pGeo.attributes.aSize.needsUpdate = true;
      pGeo.attributes.aAlpha.needsUpdate = true;

      // Labels
      formatLabels.forEach(f => {
        const o = smoothstep(f.t, f.t + 1.2, t) * (1 - smoothstep(44, 49, t));
        f.sp.material.opacity = o;
        f.sp.position.y = f.pos.y + Math.sin(t * f.floatFreq + f.floatPhase) * f.floatAmp;
        f.sp.position.x = f.pos.x + Math.cos(t * f.floatFreq * 0.6 + f.floatPhase) * 0.12;
        f.sp.visible = o > 0.01;
      });

      catLabels.forEach((c, i) => {
        const o = smoothstep(c.t, c.t + 1.4, t) * (1 - smoothstep(70, 74, t));
        c.sp.material.opacity = o;
        c.sp.visible = o > 0.01;
        const a = c.angle + t * c.speed;
        c.sp.position.set(
          Math.cos(a) * c.radius,
          c.y + Math.sin(t * c.bobFreq + i * 1.3) * c.bobAmp,
          Math.sin(a) * c.radius
        );
      });

      if (t > 63) {
        const f = smoothstep(63, 70, t);
        coreGlowMat.opacity *= 1 - f * 0.35;
      }
    }

    /* ══════════════════════════════════════════════════════════════
       RECORDING (CCapture + WAV)
       ══════════════════════════════════════════════════════════════ */
    const AUTO_RECORD = new URLSearchParams(location.search).get('record') === '1';
    const FPS = 60;
    const recBtn = document.getElementById('recBtn');
    const recLabel = document.getElementById('recLabel');
    const recStatus = document.getElementById('recStatus');

    function setStatus(txt) { recStatus.textContent = txt; recStatus.classList.add('show'); }
    function hideStatus() { recStatus.classList.remove('show'); }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    function audioBufferToWav(buffer) {
      const numCh = buffer.numberOfChannels;
      const len = buffer.length;
      const sr = buffer.sampleRate;
      const bytesPerSample = 2;
      const blockAlign = numCh * bytesPerSample;
      const dataSize = len * blockAlign;
      const bufferSize = 44 + dataSize;
      const ab = new ArrayBuffer(bufferSize);
      const view = new DataView(ab);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);
      let offset = 44;
      const channels = [];
      for (let c = 0; c < numCh; c++) channels.push(buffer.getChannelData(c));
      for (let i = 0; i < len; i++) {
        for (let c = 0; c < numCh; c++) {
          let s = Math.max(-1, Math.min(1, channels[c][i]));
          s = s < 0 ? s * 0x8000 : s * 0x7FFF;
          view.setInt16(offset, s, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: 'audio/wav' });
    }

    async function renderAudioTrack() {
      const sr = 44100;
      const totalDur = TOTAL + 3.0;
      const ctx = new OfflineAudioContext(2, Math.ceil(totalDur * sr), sr);
      for (const ev of vortexEvents) {
        scheduleVortexOnCtx(ctx, ev.time, ev.duration, ev.intensity);
      }
      const rendered = await ctx.startRendering();
      return audioBufferToWav(rendered);
    }

    async function runRecording() {
      recBtn.disabled = true;
      recLabel.textContent = 'Recording';
      audioEnabled = false;

      vortexEvents.length = 0;
      elapsed = 0;
      nextScrape = 16.6;
      corePulseVal = 0;
      collected = 0;
      scaleSpawnAcc = 0;
      pCursor = 0;
      pending.length = 0;
      particles.forEach(p => { p.active = false; });
      for (let i = 0; i < PARTICLE_MAX; i++) alphaArr[i] = 0;
      ringFX.forEach(r => { world.remove(r.mesh); r.mesh.material.dispose(); });
      ringFX.length = 0;

      await new Promise(r => setTimeout(r, 200));

      if (typeof CCapture === 'undefined') {
        setStatus('ERROR: CCapture no cargó');
        recBtn.disabled = false;
        return;
      }

      setStatus('Iniciando grabador...');

      const capturer = new CCapture({
        format: 'webm',
        framerate: FPS,
        quality: 100,
        name: 'doxing-1080x1920',
        verbose: false
      });

      capturer.start();

      const totalFrames = Math.ceil((TOTAL + 1.5) * FPS);

      for (let frame = 0; frame <= totalFrames; frame++) {
        elapsed = Math.min(frame / FPS, TOTAL + 1.5);
        update(elapsed, 1 / FPS);
        renderer.render(scene, camera);
        capturer.capture(renderer.domElement);

        if (frame % 15 === 0) {
          const pct = Math.round((frame / totalFrames) * 100);
          setStatus(`Render ${frame}/${totalFrames} · ${pct}%`);
          await new Promise(r => setTimeout(r, 0));
        }
      }

      setStatus('Codificando video...');
      capturer.stop();
      capturer.save();

      // Esperar a que el guardado inicie
      await new Promise(r => setTimeout(r, 800));

      setStatus('Generando audio WAV...');
      try {
        const wavBlob = await renderAudioTrack();
        downloadBlob(wavBlob, 'doxing-1080x1920.wav');
      } catch (e) {
        console.error('Audio render failed', e);
      }

      setStatus('✓ Listo · video + wav descargados');
      setTimeout(hideStatus, 4000);
      recBtn.disabled = false;
      recLabel.textContent = 'Record';
      audioEnabled = true;
      IS_RECORDING = false;   // ← NUEVO: reactiva el audio en vivo
    }

    recBtn.addEventListener('click', () => {
      if (!recBtn.disabled) runRecording();
    });

    if (AUTO_RECORD) {
      // Auto-arranque con ?record=1
      setTimeout(runRecording, 800);
    }

    /* ══════════════════════════════════════════════════════════════
       LOOP
       ══════════════════════════════════════════════════════════════ */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (playing && !AUTO_RECORD && !IS_RECORDING) {
        elapsed += dt;
        if (elapsed > TOTAL + 1.5) elapsed = TOTAL + 1.5;
      }
      update(elapsed, dt);
      renderer.render(scene, camera);
    }

    /* ══════════════════════════════════════════════════════════════
       RESIZE — sólo escala el CSS del stage, el render es fijo 1080x1920
       ══════════════════════════════════════════════════════════════ */
    function updateStageScale() {
      const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      document.documentElement.style.setProperty('--stage-scale', s);
    }
    window.addEventListener('resize', updateStageScale);
    window.addEventListener('orientationchange', () => setTimeout(updateStageScale, 120));
    updateStageScale();

    /* Start */
    animate();
  </script>
</body>
